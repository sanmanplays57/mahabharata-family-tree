  kind: group
  title: Danava sons of Kalanemi
  summary: Six Danava sons of Kalanemi who won from Brahma a boon that no god or sage could kill them. Hiranyakashipu, angered that they had sought their boon from Brahma rather than from him, renounced his "affection" for them and cursed them — their own father would kill them in the womb. The text does not say how he was related to them. Vishnu had Nidra place their life-breaths in Devaki's first six pregnancies. Kalanemi was reborn as Kamsa.
