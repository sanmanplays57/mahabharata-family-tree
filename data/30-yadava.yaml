  summary: Son of Vasudeva and Devaki, raised among cowherds in Gokula. Prince of Dvaraka, cousin and ally of the Pandavas, and Arjuna's charioteer, to whom he speaks the Bhagavad Gita. Narayana to Arjuna's Nara.
  wiki: Krishna
  parents:
    - { id: vasudeva, rel: father, cite: adi 63 }
    - { id: devaki, rel: mother, cite: adi 63 }
    - { id: nanda, rel: adoptive-father, ver: harivamsa, cite: "Harivamsa 47.33, 48.12; Bhagavata Purana 10.3.51", note: "Vasudeva carried the newborn to Nanda's herd-station and laid him in Yashoda's bed." }
    - { id: yashoda, rel: adoptive-mother, ver: harivamsa, cite: "Harivamsa 48.13; Bhagavata Purana 10.3.51" }
  spouses:
    - { id: rukmini, cite: "PE: PRADYUMNA" }
    - { id: satyabhama, cite: "PE: SATYABHAMA" }
    - { id: jambavati, cite: "PE: JAMBAVATI" }
    - { id: gandhari-krishna, cite: "CE 16.8.71" }
    - { id: shaibya-krishna, cite: "CE 16.8.71" }
    - { id: haimavati-krishna, cite: "CE 16.8.71" }
  incarnation:
    - { of: vishnu, kind: portion, cite: adi 67, note: "Adi 67: a portion of Narayana. Adi 63 instead says “Vishnu himself” was born of Devaki.", disputed: true }
    - { of: vishnu, kind: avatar, cite: adi 199, note: "In Vyasa's five-Indras story, Krishna sprang from one of Narayana's hairs — the black one.", disputed: true }
  returned:
    - { to: vishnu, ver: vulgate, cite: "svargarohana 5", note: "“Vasudeva was a portion of Narayana; accordingly he entered Narayana.” That verse is starred in the Critical Edition (18.5 *0024); its main text has Yudhishthira find Govinda in heaven “in his Brahma form”, attended by his weapons in person (CE 18.4.2–3)." }

- id: balarama
