# Yadavas / Vrishnis / Andhakas: Krishna's people.

- id: shura
  name: Shura
  aka: [Sura, Shurasena, Surasena]
  sex: m
  kind: human
  house: yadava
  title: Yadava chief, grandfather of Krishna
  summary: Foremost of the Yadus, father of Vasudeva and of Pritha (Kunti). He gave Pritha as a baby to his childless cousin Kuntibhoja, which makes Krishna the Pandavas' first cousin.
  wiki: Shurasena
  notes: "In the Harivamsa, Shura is the son of Devamidhusha and Ashmaki, and Devamidhusha a son of Kroshtu and Madri, which makes Shura's line, and Krishna's, Vrishni rather than Andhaka (24.2, 24.14)."
  pe: SURA VI
  parents:
    - { id: devamidhusha, rel: father, ver: purana, cite: "Vishnu Purana 4.14.7", note: "“Of Shura, son of Devamidhusha, the wife was Marisha.” The Puranic Encyclopaedia’s genealogy skips Devamidhusha and makes Hridika Shura’s father." }
    - { id: ashmaki-devamidhusha, rel: mother, ver: harivamsa, cite: "Harivamsa 24.14" }

