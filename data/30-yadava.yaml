- id: revati
  name: Revati
  sex: f
  kind: human
  house: other
  title: wife of Balarama
  summary: Daughter of King Kakudmi (Raivata), of the line of Manu's son Sharyati. She and her father waited ages in Brahma's realm, and returned to earth far taller than the people of Balarama's time.
  wiki: Revati
  parents:
    - { id: kakudmi, rel: father, far: true, cite: "Vishnu Purana 4.1.44-45, 4.1.73; Bhagavata Purana 9.3.29", note: "Kakudmi took her to Brahma to ask who should marry her; while a Gandharva song played, ages passed on earth. Brahma sent them back to Balarama, who, finding her too tall, bent her down to size with the tip of his plough." }

