    - { id: krittikas, rel: adoptive-mother, cite: "CE 3.221.25, 3.221.71", note: "Called kṛttikāsuta, “son of the Krittikas”." }
  spouses:
    - { id: devasena, cite: "CE 3.218.43-45" }

