# Svayambhuva Manu's daughters and the sages' wives, in two Puranic versions that
# disagree: the Vishnu Purana (1.7, 1.10) makes the sages' wives daughters of Daksha
# and Prasuti; the Bhagavata (3.12, 3.24, 4.1) makes nine of them daughters of Kardama
# and Devahuti. Anasuya and Khyati appear in both lists, so they carry both
# parentages and the viewer marks them with a "?".

- id: svayambhuva-manu
  name: Svayambhuva Manu
  aka: [Svayambhuva, Swayambhuva Manu, the first Manu]
  sex: m
  kind: human
  house: other
  title: the first Manu
  summary: The first of the fourteen Manus, made by Brahma out of his own self. His wife Shatarupa bore him two sons, Priyavrata and Uttanapada, and three daughters, Akuti, Devahuti and Prasuti.
  wiki: Svayambhuva Manu
  ver: purana
  parents:
    - { id: brahma, rel: father, cite: "Vishnu Purana 1.7.14", note: "Brahma “made his own self, born of himself, into Manu Svayambhuva”." }
  spouses:
    - { id: shatarupa, cite: "Vishnu Purana 1.7.15; Bhagavata Purana 3.12.54" }

- id: shatarupa
  name: Shatarupa
  aka: [Satarupa]
