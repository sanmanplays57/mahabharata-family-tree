    - { id: simhika, rel: mother, ver: "purana", cite: "Vishnu Purana 1.21.10-11; Vayu Purana 2.7.17-20" }

- id: gargya
  name: "Gargya"
  sex: m
  kind: rishi
  title: "guru of the Vrishnis and Andhakas, father of Kalayavana"
  summary: "The celibate preceptor of the Vrishnis and Andhakas. Taunted as impotent by his brother-in-law, he lived on iron filings for twelve years until Shiva granted him a son who would defeat the Yadavas; that son was Kalayavana. Not Manyu's son Garga."
  ver: harivamsa

- id: gopali
  name: "Gopali"
  sex: f
  kind: apsara
  title: "apsara, mother of Kalayavana"
