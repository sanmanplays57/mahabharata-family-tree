- id: vandin
  name: "Vandin"
  aka: ["Bandin", "Bandi"]
  sex: m
  kind: other
  title: "debater at Janaka's court, son of Varuna"
  summary: "The court disputant of Janaka of Mithila who drowned the brahmins he defeated in debate, among them Kahoda. Beaten by the boy Ashtavakra, he revealed that he was the son of King Varuna and had sent the brahmins to his father's twelve-year sacrifice; they came back alive."
  wiki: "Vandin"
  parents:
    - { id: varuna, rel: father, cite: "CE 3.134.24, 3.134.31" }

- id: nachiketa
