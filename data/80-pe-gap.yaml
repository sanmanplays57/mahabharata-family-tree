  name: "Yajnavalkya"
  sex: m
  kind: rishi
  title: "sage, son of Brahmarata, Vaishampayana's pupil"
  summary: "Son of Brahmarata and pupil of Vaishampayana. When his teacher demanded back the Yajurveda he had taught him, he vomited it out and won a new Yajus from the Sun. In the epic he teaches Janaka of Mithila. The Puranic Encyclopaedia names his two wives Maitreyi and Kalyani."
  wiki: "Yajnavalkya"
  parents:
    - { id: brahmarata, rel: father, ver: "purana", cite: "Vishnu Purana 3.5.3" }

- id: brahmarata
  name: "Brahmarata"
  sex: m
  kind: rishi
  title: "father of Yajnavalkya"
  summary: "A brahmin, father of the sage Yajnavalkya."
  ver: purana

- id: shaunaka
  name: "Shaunaka"
  aka: ["Saunaka"]
  sex: m
  kind: rishi
  title: "head of the Naimisha sages, son of Shunaka"
  summary: "The kulapati at whose twelve-year sacrifice in the Naimisha forest Ugrashravas recited the Mahabharata. The Anushasana Parva makes him the son of Shunaka, Ruru's son by Pramadvara, at the end of the line of Gritsamada."
  wiki: "Shaunaka"
  parents:
    - { id: shunaka, rel: father, cite: "CE 13.31.62" }

- id: parjanya
  name: "Parjanya"
  sex: m
  kind: god
  title: "rain god, one of the twelve Adityas"
  summary: "The god of rain and clouds, counted among the Adityas present at Arjuna's birth. The Vayu Purana names him the tenth of Kashyapa's twelve Adityas and lord of oceans, rivers, clouds and rain."
  wiki: "Parjanya (Hinduism)"
  parents:
    - { id: kashyapa, rel: father, ver: "purana", cite: "Vayu Purana 2.5.66-67" }
    - { id: aditi, rel: mother, cite: "CE 1.114.55-56; Vayu Purana 2.5.66-67", note: "Counted among the Adityas, the sons of Aditi." }

- id: putana
  name: "Putana"
  sex: f
  kind: rakshasa
  title: "demoness sent by Kamsa, killed by the infant Krishna"
  summary: "A child-killing demoness whom Kamsa sent to Gokula; she offered the infant Krishna her poisoned breast and he sucked out her life. The Brahmavaivarta makes her Bali's daughter, or Bali's daughter Ratnamala reborn, who had longed to suckle Vamana."
  wiki: "Putana"
  parents:
    - { id: bali, rel: father, ver: "purana", cite: "Brahmavaivarta Purana 4.115", note: "Brahmavaivarta 4.10 says instead that Bali's daughter Ratnamala, wishing to suckle Vamana, was reborn as Putana." }

- id: ajamila
  name: "Ajamila"
  sex: m
  kind: human
  house: other
  title: "fallen brahmin of Kanyakubja saved by the name of Narayana"
  summary: "A brahmin of Kanyakubja who lived with a maidservant and by theft and gambling. Of his ten sons he loved the youngest, Narayana; dying, he called the boy's name, and Vishnu's messengers drove off Yama's."
  wiki: "Ajamila"
  ver: purana

- id: narayana-ajamila
  name: "Narayana (Ajamila's son)"
  sex: m
  kind: human
  house: other
  title: "Ajamila's youngest son"
  summary: "The youngest of Ajamila's ten sons, his father's favourite; calling his name at death saved Ajamila."
  ver: purana
  parents:
    - { id: ajamila, rel: father, cite: "Bhagavata Purana 6.1.24" }
