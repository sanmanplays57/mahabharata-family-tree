  title: "Menaka's daughter"
  summary: "A nymph, daughter of Menaka. The demon Vidyudrupa married her, but Kandhara, a bird of Garuda's line, killed him and took her; their child was Tarkshi."
  pe: "MADANIKA"
  ver: purana
  parents:
    - { id: menaka, rel: mother, ver: "purana", cite: "PE: MADANIKA", note: "Markandeya Purana ch. 2, per the PE." }

