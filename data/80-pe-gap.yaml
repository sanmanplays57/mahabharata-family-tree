# People from the Puranic Encyclopaedia gap list (build/pe-gap.mjs), each checked in a text on disk.
# Written by build/pe-gap/merge.cjs from build/pe-gap/add-N.yaml; claims checked with build/verify-claims.mjs.

- id: ajaka
  name: "Ajaka"
  aka: ["Ajakashva"]
  sex: m
  kind: human
  house: other
  title: "Balakashva's father in the Puranas"
  summary: "A king of Jahnu's line. The Vishnu Purana makes him the son of Jahnu's son Sumantu, the Vayu the son of Jahnu's son Suhotra; both make him Balakashva's father. The Agni Purana, as the Puranic Encyclopaedia reports it, makes Ajakashva and Balakashva brothers, sons of Jahnu."
  pe: "AJAKASVA"
  ver: purana
  parents:
    - { id: jahnu, rel: father, ver: "purana", cite: "PE: AJAKASVA", note: "Agni Purana, per the PE. The Vishnu Purana (4.7.5) puts Sumantu, the Vayu (2.29.56-57) Suhotra, between Jahnu and Ajaka." }

- id: manu-sons
  name: "Manu's other sons"
  kind: group
  title: "Vaivasvata Manu's sons"
  summary: "The epic names ten children of Manu; Vena, Dhrishnu, Narishyanta, Nabhaga, Ikshvaku, Karusha, Sharyati, Ila the eighth, Prishadhra the ninth and Nabhagarishta the tenth. Ikshvaku, Sharyati and Ila have their own boxes."
  members: ["Vena", "Dhrishnu", "Narishyanta", "Nabhaga", "Karusha", "Prishadhra", "Nabhagarishta"]
  membersCite: "CE 1.70.13-14; adi 75"
  parents:
    - { id: manu, rel: father, cite: "CE 1.70.13-14; adi 75" }

- id: namuchi
  name: "Namuchi"
  aka: ["Namuci"]
  sex: m
  kind: asura
  title: "Danava beheaded by Indra with foam"
  summary: "One of Danu's forty sons. Afraid of Indra, he hid in a ray of the sun; Indra made friends with him, swearing not to kill him with anything wet or dry, by night or by day, then cut off his head with the foam of the waters in a mist. The head followed Indra calling him friend-killer until he bathed at the Aruna."
  pe: "NAMUCI I"
  parents:
    - { id: danu, rel: mother, cite: "CE 1.59.21-22; adi 65" }
    - { id: kashyapa, rel: father, cite: "adi 65" }

- id: ruha
  name: "Ruha"
  sex: f
  kind: other
  title: "mother of the flowering and fruiting trees"
  summary: "One of three plant-mothers in a passage of the vulgate's Adi Parva; trees that bear flowers and fruit are called her offspring."
  pe: "RUHA"
  ver: vulgate
  parents:
    - { id: surasa, rel: mother, ver: "vulgate", cite: "PE: RUHA", note: "The Puranic Encyclopaedia, citing the southern recension, makes Ruha, Anala and Virudha Surasa's daughters. The Critical Edition's starred passage 1.60 *0552 makes the three plant-mothers daughters of Ira." }

- id: virata-father
  name: "Virata's father"
  sex: m
  kind: human
  house: other
  title: "father of Virata and his brothers, unnamed"
  summary: "The epic does not name the father of Virata, king of the Matsyas. This box joins Virata to his brothers."

- id: virata-brothers
  name: "Virata's brothers"
  kind: group
  title: "the Matsya princes, Virata's brothers"
  summary: "Shatanika, Virata's dear brother, and Madirashva, younger than Shatanika, armed for the fight against the Trigartas alongside Suryadatta. The Puranic Encyclopaedia counts Suryadatta a brother too."
  members: ["Shatanika", "Madirashva", "Suryadatta", "Sudashana", "Shrutanika", "Shrutadhvaja", "Balanika", "Jayanika", "Jayashva", "Rathavahana", "Chandrodaya", "Kamaratha"]
  membersCite: "CE 4.30.10-13; PE: SURYADATTA"
  parents:
    - { id: virata-father, rel: father, cite: "CE 4.30.10-11", note: "virāṭasya priyo bhrātā śatānīkaḥ; śatānīkād avarajo madirāśvaḥ." }

- id: trigarta-king
  name: "King of Trigarta (Susharma's father)"
  sex: m
  kind: human
  house: other
  title: "father of Susharma and his brothers"
  summary: "Father of Susharma of Trigarta and of the brothers who fought beside him. The Puranic Encyclopaedia, reading the vulgate's list of suitors at Draupadi's svayamvara, calls Susharma the son of Vriddhakshema."

- id: susharma
  name: "Susharma"
  aka: ["Susharman"]
  sex: m
  kind: human
  house: other
  title: "king of Trigarta, lord of Prasthala"
  summary: "King of the Trigartas, who seized Virata's cattle while the Kauravas raided from the other side. In the war he fought Arjuna at the head of the Trigartas, and Arjuna killed him with an arrow through the heart."
  pe: "SUSARMA I"
  parents:
    - { id: trigarta-king, rel: father, cite: "CE 8.19.4", note: "“The king of the Trigartas, surrounded by his brothers and sons”." }

- id: susharma-brothers
  name: "Susharma's brothers"
  kind: group
  title: "the Trigarta princes"
  summary: "Satyaratha, Satyadharman, Satyavarman, Satyeshu and Satyakarman, the five brothers who swore to draw Arjuna away from the field and kill him; and Mitradeva, Shrutanjaya and Saushruti, who rode with the Trigarta king among his brothers and sons. Arjuna killed them."
  members: ["Satyaratha", "Satyadharman", "Satyavarman", "Satyeshu", "Satyakarman", "Mitradeva", "Shrutanjaya", "Saushruti"]
  membersCite: "CE 7.16.17-18, 8.19.3-4; PE: SATYAKARMA II, MITRADEVA"
  parents:
    - { id: trigarta-king, rel: father, cite: "CE 7.16.17-18, 8.19.3-4; PE: SATYAKARMA II, MITRADEVA", note: "The CE calls the five Satya- princes brothers and has the Trigarta king surrounded by his brothers and sons; the Puranic Encyclopaedia makes Satyakarman, Mitradeva and others Susharma's brothers." }

