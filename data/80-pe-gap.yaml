    - { id: viprachitti, rel: father, ver: "purana", cite: "Vishnu Purana 1.21.10-11" }
    - { id: simhika, rel: mother, ver: "purana", cite: "Vishnu Purana 1.21.10-11" }

- id: vatapi
  name: "Vatapi"
  sex: m
  kind: asura
  title: "Ilvala's younger brother, digested by Agastya"
  summary: "Ilvala's younger brother (CE 3.94.4), who took the form of a goat to be cooked and served to brahmins and then burst out of them; Agastya ate and digested him. The Bhagavata makes him Hrada's son by Dhamani; the Vishnu Purana and Vayu Purana count a Vatapi among Simhika's sons by Viprachitti."
  wiki: "Ilvala and Vatapi"
  parents:
