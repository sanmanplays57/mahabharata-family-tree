  sex: m
  kind: human
  house: other
  title: "Pratardana's son"
  summary: "Pratardana's famous son, who was brought up in a cowpen by calves (vatsa) and so escaped Rama Jamadagnya's slaughter of the kshatriyas; the Earth names him among the kings she asked to be her protectors. The Bhagavata instead makes Vatsa another name of Pratardana."
  pe: "VATSA I"
  parents:
    - { id: pratardana, rel: father, cite: "CE 12.49.71" }

- id: kandu
  name: "Kandu"
  sex: m
  kind: rishi
  title: "sage, father of Marisha"
  summary: "A sage learned in the Vedas who did severe penance on the bank of the Gomati. Indra sent the apsara Pramlocha to break it, and he lived with her for over a hundred years; the child she carried was born from her sweat, taken up by the trees, and became Marisha."
  pe: "KANDU"
  ver: purana

- id: pramlocha
  name: "Pramlocha"
  sex: f
  kind: apsara
  title: "apsara, Marisha's mother"
  summary: "The apsara Indra sent to disturb the sage Kandu's penance. The embryo she carried left her body as sweat; the trees took it up, the wind joined it and the Moon nourished it, and it grew into Marisha."
  ver: purana

- id: rishabha-sons
  name: "Bharata's brothers (Rishabha's sons)"
  kind: group
  title: "Rishabha's other sons by Jayanti"
  summary: "Of Rishabha's hundred sons by Jayanti, Bharata was the eldest. Next came nine who ruled parts of the land, Kushavarta, Ilavarta, Brahmavarta, Malaya, Ketu, Bhadrasena, Indrasprik, Vidarbha and Kikata, then nine sages, Kavi, Havi, Antariksha, Prabuddha, Pippalayana, Avirhotra, Drumila, Chamasa and Karabhajana. The Puranic Encyclopaedia adds Aryavarta."
  ver: purana
  members: ["Kushavarta", "Ilavarta", "Brahmavarta", "Malaya", "Ketu", "Bhadrasena", "Indrasprik", "Vidarbha", "Kikata", "Kavi", "Havi", "Antariksha", "Prabuddha", "Pippalayana", "Avirhotra", "Drumila", "Chamasa", "Karabhajana", "Aryavarta"]
  membersCite: "Bhagavata Purana 5.4.8-11; PE: ARYAVARTA"
