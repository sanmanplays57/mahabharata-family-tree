  pe: "MAHISA I"
  ver: purana
  parents:
    - { id: rambha-danava, rel: father, cite: "PE: MAHISA I", note: "Vamana Purana 17, per the PE." }

- id: gajasura
  name: "Gajasura"
  sex: m
  kind: asura
  title: "elephant asura, son of Mahisha, killed by Shiva"
  summary: "Son of Mahisha. To avenge his father's death at the Goddess's hands he did penance, won a boon and harassed the gods, until Shiva killed him with his trident."
  wiki: "Gajasura"
  ver: purana
  parents:
    - { id: mahishasura, rel: father, cite: "Shiva Purana 2.5.57.3-4" }

- id: upamanyu
  name: "Upamanyu"
  sex: m
  kind: rishi
  title: "sage devoted to Shiva, son of Vyaghrapada"
  summary: "Son of the sage Vyaghrapada; his younger brother was a Dhaumya. As a boy in the hermitage he cried for milk, and his mother told him that only Shiva could give it; his penance won Shiva's favour, and he later taught Krishna Shiva's thousand names."
  wiki: "Upamanyu"
  parents:
    - { id: vyaghrapada, rel: father, cite: "CE 13.14.75" }

- id: vyaghrapada
  name: "Vyaghrapada"
  sex: m
  kind: rishi
  title: "sage, father of Upamanyu"
  summary: "A sage of the Krita age versed in the Vedas and their limbs, father of Upamanyu and of a younger son Dhaumya."
  wiki: "Vyaghrapada"

