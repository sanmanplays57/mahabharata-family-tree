  summary: "The son Shiva granted Gargya, born of the apsara Gopali and brought up by the sonless king of the Yavanas, who crowned him. He besieged Mathura; Krishna led him into Muchukunda's cave, where the waking king's glance burnt him to ashes. The Vishnu Purana has him born of the Yavana king's wife."
  wiki: "Kalayavana"
  ver: harivamsa
  parents:
    - { id: gargya, rel: father, cite: "Harivamsa 85.7-15; Vishnu Purana 5.23.1-5" }
    - { id: gopali, rel: mother, cite: "Harivamsa 85.14-15", note: "The Vishnu Purana (5.23.4) has him born of the wife of the sonless Yavana king." }

- id: kushadhvaja-brihaspati
  name: "Kushadhvaja (Brihaspati's son)"
  sex: m
  kind: rishi
  title: "brahmarshi, son of Brihaspati, Vedavati's father"
  summary: "A brahmarshi, son of Brihaspati and his equal in wisdom. He refused his daughter Vedavati to every suitor, wishing Vishnu for her husband, and the daitya Shambhu killed him in his sleep. Not Janaka's brother Kushadhvaja."
  ver: ramayana
  parents:
    - { id: brihaspati, rel: father, cite: "Ramayana 7.17.7" }

- id: vedavati
  name: "Vedavati"
  sex: f
  kind: human
  house: other
  title: "Kushadhvaja's daughter, reborn as Sita"
  summary: "Born of her father's Vedic recitation, she did penance in the Himalayas to win Vishnu as husband. When Ravana seized her by the hair she cut it off, entered the fire and vowed to be reborn for his death; she was born again as Sita."
  wiki: "Vedavati"
  ver: ramayana
  parents:
    - { id: kushadhvaja-brihaspati, rel: father, cite: "Ramayana 7.17.7-8" }

