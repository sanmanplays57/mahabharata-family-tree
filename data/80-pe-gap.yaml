  title: "Vaishvanara's daughter, Kashyapa's wife, mother of the Paulomas"
  summary: "One of the four daughters of the Danava Vaishvanara, married with her sister Kalaka to Kashyapa; she bore the Paulomas. Not Bhrigu's wife Puloma, nor the Danava Puloman."
  ver: purana
  spouses:
    - { id: kashyapa, cite: "Bhagavata Purana 6.6.33-35" }

- id: paulomas
  name: "The Paulomas"
  aka: ["Paulomas"]
  kind: group
  title: "Danavas, sons of Puloma and Kashyapa, killed by Arjuna"
  summary: "Danavas who with the Kalakeyas held the flying city Hiranyapura; Arjuna destroyed them. The Bhagavata makes them sons of Kashyapa by Vaishvanara's daughter Puloma."
  parents:
    - { id: puloma-vaishvanari, rel: mother, ver: "purana", cite: "Bhagavata Purana 6.6.34-36", note: "CE 3.170.6 names the daiteyi Puloma beside Kalaka." }
    - { id: kashyapa, rel: father, ver: "purana", cite: "Bhagavata Purana 6.6.34-35" }

