  sex: m
  kind: rishi
  title: "son of the sage Uddalaki, who went to Yama"
  summary: "Cursed by his father Uddalaki in a moment of anger to see Yama, he went to Yama's realm, was honoured there and came back to tell his father of the rewards of giving cows. The Puranic Encyclopaedia, after the Katha Upanishad, names his father Vajashravas."
  wiki: "Nachiketa"
  parents:
    - { id: uddalaki, rel: father, cite: "CE 13.70.2-3" }

- id: uddalaki
  name: "Uddalaki"
  sex: m
  kind: rishi
  title: "sage, father of Nachiketa"
  summary: "The sage who sent his son Nachiketa to Yama with a hasty curse. The name is a patronymic, son of Uddalaka; the text does not say which son. The Puranic Encyclopaedia names Nachiketa's father Vajashravas."
  same:
    - { as: shvetaketu, cite: "CE 3.132.1, 3.132.3", note: "Auddalaki, son of Uddalaka, is the patronymic the epic gives Shvetaketu; the Anushasana Parva does not say which son of Uddalaka is meant." }

