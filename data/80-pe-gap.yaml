  sex: m
  kind: asura
  title: "daitya who fed his brother Vatapi to brahmins"
  summary: "A daitya of Manimati who turned his younger brother Vatapi into a goat, fed him to brahmins and called him back out of their bellies, killing them. Agastya digested Vatapi and took Ilvala's wealth. The Bhagavata makes the brothers sons of Hrada by Dhamani; the Vishnu Purana counts Ilvala and Vatapi among Simhika's sons by Viprachitti."
  wiki: "Ilvala and Vatapi"
  parents:
