  summary: "Born of Varangi to Vajranga amid evil portents and named by Kashyapa. By penance he won near-invincibility and drove the gods from heaven; Skanda, the son of Shiva, killed him. His three sons ruled the three cities, Tripura."
  wiki: "Tārakāsura"
  ver: purana
  parents:
    - { id: vajranga, rel: father, cite: "Shiva Purana 2.3.15.1-2" }
    - { id: varangi-vajranga, rel: mother, cite: "Shiva Purana 2.3.15.1-2" }

