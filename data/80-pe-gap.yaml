  summary: "On the Gandharva Angaraparna's advice the Pandavas chose as their priest Dhaumya, Devala's younger brother, who was practising austerities at the Utkochaka tirtha. He stayed their priest through the exile and the war."
  wiki: "Dhaumya"
  parents:
    - { id: pratyusha, rel: father, cite: "CE 1.174.2; adi 185", note: "The text calls him Devala's younger brother (yavīyān devalasya bhrātā); the father is Devala's, CE 1.60.25." }

