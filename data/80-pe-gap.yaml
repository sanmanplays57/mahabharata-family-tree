  pe: "MAHISA I"
  ver: purana

- id: mahishasura
  name: "Mahisha"
  aka: ["Mahishasura"]
  sex: m
  kind: asura
  title: "buffalo asura, son of Rambha, killed by the Goddess"
  summary: "Son of the Danava Rambha by a she-buffalo. He became king of the asuras and drove the gods from heaven until the Goddess killed him. His son Gajasura avenged him on the gods."
