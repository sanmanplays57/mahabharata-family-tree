  title: "Kalakeya Danava, Shurpanakha's husband"
  summary: "Lord of the Kalakeya Danavas, to whom Ravana gave his sister Shurpanakha. Ravana later killed him unknowingly in his war on the Kalakeyas, and to console the widowed Shurpanakha sent her with Khara to the Dandaka forest."
  pe: "VIDYUJJIHVA II"
  ver: ramayana
  spouses:
