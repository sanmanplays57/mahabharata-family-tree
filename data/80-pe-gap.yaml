  kind: group
  title: "Taraka's three sons, lords of the three cities"
  summary: "After the defeat of the daityas, Taraka's three sons did penance and won three cities, of gold, silver and iron, which Shiva burnt with one arrow. Tarakaksha's son Hari made a lake that revived the dead asuras."
  wiki: "Tripurasura"
  members: ["Tarakaksha", "Kamalaksha", "Vidyunmalin"]
  membersCite: "CE 8.24.4; Shiva Purana 2.5.1.7-8"
  parents:
    - { id: taraka, rel: father, cite: "CE 8.24.4; Shiva Purana 2.5.1.7-8" }

- id: kumbhanda
  name: "Kumbhanda"
  sex: m
  kind: asura
  title: "Bana's minister, Chitralekha's father"
  summary: "Minister of the asura Bana and father of Chitralekha, Usha's friend."
  ver: purana

- id: chitralekha
  name: "Chitralekha"
  sex: f
  kind: asura
  title: "Usha's friend, daughter of Kumbhanda"
  summary: "Daughter of Bana's minister Kumbhanda and friend of Bana's daughter Usha. She painted the gods and princes until Usha recognised Aniruddha, the man of her dream, then carried him from Dvaraka to Usha's chamber by her yogic power."
  wiki: "Chitralekha (Hinduism)"
  ver: purana
  parents:
    - { id: kumbhanda, rel: father, cite: "Bhagavata Purana 10.62.14" }

