  wiki: "Kalakeyas"
  parents:
    - { id: kalaka-vaishvanari, rel: mother, ver: "purana", cite: "Bhagavata Purana 6.6.34-36", note: "CE 3.170.6-11 names Kalaka as the asuri for whose sons Hiranyapura was built." }
    - { id: kashyapa, rel: father, ver: "purana", cite: "Bhagavata Purana 6.6.34-35" }

