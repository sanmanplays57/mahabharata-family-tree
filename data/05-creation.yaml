# The creation genealogy of Adi 65-66 (Daksha's daughters, Kashyapa's lines, Dharma's family,
# Bhrigu's line) plus Pulastya's line from the Ramopakhyana (CE 3.258-259) and the
# Jaya-Vijaya rebirths (Puranic Encyclopaedia, from the Bhagavata).

# --- Daksha's daughters married to Kashyapa (Adi 65: thirteen; Adi 66: "thirteen on Kasyapa") ---
- id: diti
  name: Diti
  sex: f
  kind: asura
  title: mother of the Daityas
  summary: Daughter of Daksha and wife of Kashyapa; mother of Hiranyakashipu and so of the Daityas.
  wiki: Diti
  parents:
    - { id: daksha, rel: father, cite: adi 65 }
  spouses:
    - { id: kashyapa, cite: "adi 65, 66" }

- id: danu
  name: Danu
  sex: f
  kind: asura
  title: mother of the Danavas
  summary: Daughter of Daksha and wife of Kashyapa; mother of forty Danavas, among them Viprachitti, Puloman, Svarbhanu and Vrishaparvan — so the Kuru line, through Vrishaparvan's daughter Sharmishtha, descends from her.
  parents:
    - { id: daksha, rel: father, cite: adi 65 }
  spouses:
    - { id: kashyapa, cite: "adi 65, 66" }

- id: danayu
  name: Danayu
  aka: [Anayu]
  sex: f
  kind: asura
  title: mother of Vritra
  summary: Daughter of Daksha and wife of Kashyapa; mother of four asuras, Vikshara, Vala, Vira and Vritra.
  notes: "The Critical Edition reads Anayu (CE 1.59.12). Not the Danava Danayu, a son of Danu (CE 1.59.29)."
  parents:
    - { id: daksha, rel: father, cite: adi 65 }
  spouses:
    - { id: kashyapa, cite: "adi 65, 66" }

- id: simhika
  name: Simhika
  aka: [Sinhika]
  sex: f
  kind: asura
  title: mother of Rahu
  summary: Daughter of Daksha and wife of Kashyapa; mother of Rahu, "the persecutor of the Sun and the Moon". Adi 65 separately lists Svarbhanu among Danu's sons; later texts treat Svarbhanu and Rahu as one.
  parents:
    - { id: daksha, rel: father, cite: adi 65 }
    - { id: kashyapa, rel: father, ver: purana, cite: "Vishnu Purana 1.15.141", note: "“And a daughter, Simhika, was born, Viprachitti's wife”, after Diti's two sons." }
    - { id: diti, rel: mother, ver: purana, disputed: true, cite: "Vishnu Purana 1.15.141" }
  spouses:
    - { id: kashyapa, cite: "adi 65, 66" }
    - { id: viprachitti, ver: purana, disputed: true, cite: "Vishnu Purana 1.15.141, 1.21.10" }

- id: krodha-daksha
  name: Krodha
  aka: [Krura]
  sex: f
  kind: asura
  title: daughter of Daksha, mother of the Krodhavashas
  summary: Daughter of Daksha and wife of Kashyapa, whose countless offspring were "crooked and wicked". Adi 66 gives her nine daughters, Surasa among them. Not the same as Krodha, Wrath personified.
  parents:
    - { id: daksha, rel: father, cite: adi 65 }
  spouses:
    - { id: kashyapa, cite: "adi 65, 66" }

- id: kala-daksha
  name: Kala
  sex: f
  kind: asura
  title: daughter of Daksha
  summary: Daughter of Daksha and wife of Kashyapa; her sons were "like Yama himself", Vinashana and Krodhahantri among them.
  parents:
    - { id: daksha, rel: father, cite: adi 65 }
  spouses:
    - { id: kashyapa, cite: "adi 65, 66" }

- id: pradha
  name: Pradha
  aka: [Prava]
  sex: f
  kind: apsara
  title: mother of Gandharvas and Apsaras
  summary: Daughter of Daksha and wife of Kashyapa; mother of Gandharvas such as Vishvavasu and of the apsaras Alambusha, Mishrakeshi, Tilottama, Rambha and others.
  notes: "The Critical Edition reads her name Prava (CE 1.59.44–48)."
  parents:
    - { id: daksha, rel: father, cite: adi 65 }
  spouses:
    - { id: kashyapa, cite: "adi 65, 66" }

- id: vishva
  name: Vishva
  aka: [Arishta]
  sex: f
  kind: god
  title: daughter of Daksha
  summary: Daughter of Daksha and one of Kashyapa's thirteen wives.
  notes: "The Critical Edition reads Arishta in her place among Daksha's thirteen daughters (CE 1.59.12)."
  parents:
    - { id: daksha, rel: father, cite: adi 65 }
  spouses:
    - { id: kashyapa, cite: "adi 65, 66" }

- id: vinata
  name: Vinata
  sex: f
  kind: god
  title: mother of Garuda and Aruna
  summary: Daughter of Daksha and wife of Kashyapa; mother of Garuda and Aruna. Enslaved by her co-wife Kadru after losing a wager, she was freed by Garuda bringing the nectar.
  wiki: Vinata
  parents:
    - { id: daksha, rel: father, cite: adi 65 }
  spouses:
    - { id: kashyapa, cite: "adi 65, 66" }

- id: kapila-daksha
  name: Kapila
  sex: f
  kind: god
  title: daughter of Daksha
  summary: Daughter of Daksha and wife of Kashyapa; "the Brahmanas, kine, Gandharvas and Apsaras were born of Kapila".
  parents:
    - { id: daksha, rel: father, cite: adi 65 }
  spouses:
    - { id: kashyapa, cite: "adi 65, 66" }

- id: muni-daksha
  name: Muni
  sex: f
  kind: gandharva
  title: mother of Gandharvas
  summary: Daughter of Daksha and wife of Kashyapa; mother of sixteen Devas and Gandharvas, Chitraratha among them.
  parents:
    - { id: daksha, rel: father, cite: adi 65 }
  spouses:
    - { id: kashyapa, cite: "adi 65, 66" }

- id: kadru
  name: Kadru
  sex: f
  kind: naga
  title: mother of the nagas
  summary: Daughter of Daksha and wife of Kashyapa; mother of the great serpents Shesha, Vasuki and Takshaka. She cursed her own sons to burn in Janamejaya's snake sacrifice — the curse behind the epic's frame story.
  wiki: Kadru
  parents:
    - { id: daksha, rel: father, cite: adi 65 }
  spouses:
    - { id: kashyapa, cite: "adi 65, 66" }

# --- the other Adityas (Adi 65; CE 1.59.15) ---
- id: dhatri
  name: Dhatri
  sex: m
  kind: god
  title: an Aditya
  summary: First-named of the twelve Adityas, sons of Kashyapa and Aditi.
  parents: [{ id: kashyapa, rel: father, cite: "adi 65; CE 1.59.11, 1.59.15" }, { id: aditi, rel: mother, cite: adi 65 }]

- id: mitra
  name: Mitra
  sex: m
  kind: god
  title: an Aditya
  summary: One of the twelve Adityas, god of friendship and contracts, often paired with Varuna.
  wiki: Mitra (Hindu god)
  parents: [{ id: kashyapa, rel: father, cite: adi 65 }, { id: aditi, rel: mother, cite: adi 65 }]

- id: aryaman
  name: Aryaman
  sex: m
  kind: god
  title: an Aditya
  summary: One of the twelve Adityas, sons of Kashyapa and Aditi.
  wiki: Aryaman
  parents: [{ id: kashyapa, rel: father, cite: adi 65 }, { id: aditi, rel: mother, cite: adi 65 }]

- id: varuna
  name: Varuna
  sex: m
  kind: god
  title: an Aditya, lord of the waters
  summary: One of the twelve Adityas and lord of the waters. His eldest wife was Divi, daughter of Shukra.
  wiki: Varuna
  parents: [{ id: kashyapa, rel: father, cite: adi 65 }, { id: aditi, rel: mother, cite: adi 65 }]
  spouses:
    - { id: divi, cite: adi 66 }
    - { id: gauri-varuna, cite: "CE 13.134.4, 5.115.9" }
    - { id: parnasha, cite: "CE 7.67.44" }

- id: amsha
  name: Amsha
  aka: [Ansa, Amsa]
  sex: m
  kind: god
  title: an Aditya
  summary: One of the twelve Adityas, sons of Kashyapa and Aditi.
  parents: [{ id: kashyapa, rel: father, cite: adi 65 }, { id: aditi, rel: mother, cite: adi 65 }]

- id: bhaga
  name: Bhaga
  aka: [Vaga]
  sex: m
  kind: god
  title: an Aditya
  summary: One of the twelve Adityas, god of good fortune.
  wiki: Bhaga
  parents: [{ id: kashyapa, rel: father, cite: adi 65 }, { id: aditi, rel: mother, cite: adi 65 }]

- id: pushan
  name: Pushan
  aka: [Pusha]
  sex: m
  kind: god
  title: an Aditya
  summary: One of the twelve Adityas. Ganguli's list reads "Usha" here, but the Critical Edition (1.59.15) has pūṣā, Pushan.
  wiki: Pushan
  parents: [{ id: kashyapa, rel: father, cite: adi 65 }, { id: aditi, rel: mother, cite: adi 65 }]

- id: savitri-aditya
  name: Savitr
  aka: [Savitri, Savita]
  sex: m
  kind: god
  title: an Aditya, father of the Ashvins
  summary: One of the twelve Adityas, a solar god. By Tvashtri's daughter, who had taken the form of a mare, he fathered the twin Ashvins. The Puranas tell the same story of Vivasvat, the Sun.
  same:
    - { as: surya, cite: "CE 1.60.34; Vishnu Purana 3.2.7", note: "The epic gives the Ashvins' father as Savitr; the Vishnu and Brahma Puranas tell the same mare story of Vivasvat. Both are counted among the twelve Adityas (Adi 65)." }
  wiki: Savitr
  parents: [{ id: kashyapa, rel: father, cite: "adi 65; CE 1.59.11, 1.59.15" }, { id: aditi, rel: mother, cite: adi 65 }]
  spouses:
    - { id: tvashtri-daughter, cite: "CE 1.60.34" }

- id: tvashtri
  name: Tvashtri
  aka: [Tvashtr, Tvashta]
  sex: m
  kind: god
  title: an Aditya, the divine craftsman
  summary: One of the twelve Adityas, the fashioner of forms. His daughter became Savitr's wife and mother of the Ashvins.
  wiki: Tvashtr
  parents: [{ id: kashyapa, rel: father, cite: adi 65 }, { id: aditi, rel: mother, cite: adi 65 }]
  same:
    - { as: vishvakarma, cite: "Vishnu Purana 3.2.2, 3.2.11; Brahma Purana 4.33-54", note: "The Vishnu Purana calls Sanjna's father Vishvakarman, then says “Tvashtri himself” made Vishnu's discus from the Sun's brilliance. The Brahma Purana gives the whole story to Tvashtri. The epic keeps them apart: Tvashtri is an Aditya (Adi 65), Vishvakarman the son of the Vasu Prabhasa (Adi 66)." }

- id: tvashtri-daughter
  name: Sanjna
  aka: [Samjna, Sangya, Saranyu, Tvāṣṭrī, Tvashtri's daughter]
  sex: f
  kind: god
  title: the Sun's wife, mother of Yama and the Ashvins
  wiki: Sanjna
  summary: The Sun's wife. The epic calls her Tvāṣṭrī ("daughter of Tvashtri"), who in the form of a mare bore the twin Ashvins. In the Vishnu and Brahma Puranas she is Sanjna. She bore Vaivasvata Manu and the twins Yama and Yami, then, unable to bear the Sun's heat, left her shadow Chhaya in her place and went off as a mare to do penance. Ganguli's translation, "Tvashtri … became the wife of Savitri", turns the feminine name into the male Aditya.
  parents:
    - { id: tvashtri, rel: father, cite: "CE 1.60.34; Brahma Purana 4.15-17", note: "The epic's name Tvāṣṭrī means “daughter of Tvashtri”; in the Brahma Purana she flees to her father Tvashtri." }
    - { id: vishvakarma, rel: father, ver: purana, cite: "Vishnu Purana 3.2.2", note: "“The Sun's wife was Sanjna, daughter of Vishvakarman.”" }
  spouses:
    - { id: surya, ver: purana, cite: "Vishnu Purana 3.2.2; Brahma Purana 4.7" }

- id: yami
  name: Yami
  aka: [Yamuna, Yamuna river, Yamini]
  sex: f
  kind: god
  title: Yama's twin sister, the river Yamuna
  summary: Daughter of the Sun and Sanjna, born a twin with Yama; she became the river Yamuna "who sanctifies the world".
  wiki: Yami
  ver: purana
  parents:
    - { id: surya, rel: father, cite: "Vishnu Purana 3.2.2; Brahma Purana 4.8" }
    - { id: tvashtri-daughter, rel: mother, cite: "Vishnu Purana 3.2.2; Brahma Purana 4.8, 4.50-54" }

- id: revanta
  name: Revanta
  sex: m
  kind: god
  title: son of the Sun and Sanjna
  summary: Born of the Sun and Sanjna after the Ashvins, while the two were horse and mare.
  wiki: Revanta
  ver: purana
  parents:
    - { id: surya, rel: father, cite: "Vishnu Purana 3.2.7" }
    - { id: tvashtri-daughter, rel: mother, cite: "Vishnu Purana 3.2.7" }

- id: chhaya
  name: Chhaya
  aka: [Chaya, Savarna, Chhaya-Sanjna]
  sex: f
  kind: god
  title: Sanjna's shadow, the Sun's second wife
  summary: Sanjna's own shadow, set in her place at the Sun's side when she could not bear his heat. Taking her for Sanjna, he fathered on her Shani, the second Manu Savarni, and Tapati. Her partiality to her own children and her curse on Yama gave her away. The Brahma Purana calls her Savarna.
  wiki: Chhaya
  ver: purana
  parents:
    - { id: tvashtri-daughter, rel: birth-cause, cite: "Vishnu Purana 3.2.3; Brahma Purana 4.9-11", note: "Not born: Sanjna made her own shadow into a woman to take her place." }
  spouses:
    - { id: surya, cite: "Vishnu Purana 3.2.4; Brahma Purana 4.18" }

- id: shani
  name: Shani
  aka: [Shanaishchara, Shanaischara, Sani, Saturn]
  sex: m
  kind: god
  title: the planet Saturn
  summary: Son of the Sun by Chhaya, who "attained the status of a planet".
  wiki: Shani
  ver: purana
  parents:
    - { id: surya, rel: father, cite: "Vishnu Purana 3.2.4; Brahma Purana 4.20" }
    - { id: chhaya, rel: mother, cite: "Vishnu Purana 3.2.4; Brahma Purana 4.20" }

- id: savarni-manu
  name: Savarni Manu
  aka: [Savarni, Savarna Manu, the eighth Manu]
  sex: m
  kind: human
  house: other
  title: the second Manu born of the Sun
  summary: Son of the Sun by Chhaya, "like" (savarṇa) his elder brother Manu, hence Savarni. He is the Manu of the eighth age, still doing penance on Meru.
  wiki: Savarni Manu
  ver: purana
  parents:
    - { id: surya, rel: father, cite: "Vishnu Purana 3.2.4, 3.2.13; Brahma Purana 4.18-19" }
    - { id: chhaya, rel: mother, cite: "Vishnu Purana 3.2.4, 3.2.13; Brahma Purana 4.18-19" }

- id: vishvakarma
  name: Vishvakarma
  aka: [Vishvakarman, Viswakarma, Visvakarma, Viswakarman]
  sex: m
  kind: god
  title: architect of the gods
  summary: The architect of the gods, "the founder of all arts", son of the eighth Vasu Prabhasa by Brihaspati's sister. In the Vishnu Purana he is Sanjna's father, trims the Sun's brilliance on his lathe, and forges Vishnu's discus and Shiva's trident from what falls away.
  wiki: Vishvakarma
  parents:
    - { id: prabhasa, rel: father, cite: adi 66 }
    - { id: brihaspati-sister, rel: mother, cite: adi 66 }

- id: prabhasa
  name: Prabhasa
  sex: m
  kind: god
  title: the eighth Vasu
  summary: The eighth of the Vasus, son of Prabhata; husband of Brihaspati's sister and father of Vishvakarman.
  spouses:
    - { id: brihaspati-sister, cite: adi 66 }
  parents:
    - { id: prabhata, rel: mother, cite: "CE 1.60.19; adi 66" }

- id: brihaspati-sister
  name: Brihaspati's sister
  aka: [Bhuvana]
  sex: f
  kind: god
  title: ascetic, mother of Vishvakarman
  summary: Brihaspati's sister, "the first of women", who spoke only the truth and roamed the whole earth in penance; she became the wife of the Vasu Prabhasa and bore Vishvakarman.
  parents:
    - { id: angiras, rel: father, cite: adi 66, note: "Implied: she is Brihaspati's sister." }

# --- Diti's line ---
- id: prahlada
  name: Prahlada
  sex: m
  kind: asura
  title: eldest son of Hiranyakashipu
  summary: Eldest of Hiranyakashipu's five sons, and the grandfather of Bali.
  wiki: Prahlada
  parents:
    - { id: hiranyakashipu, rel: father, cite: adi 65 }
    - { id: kayadhu, rel: mother, ver: purana, cite: "Bhagavata Purana 6.18.12-13" }
    - { id: kamala-hiranyakashipu, rel: mother, ver: purana, cite: "Padma Purana 2.5.23-25, 2.5.31-33", note: "The Padma Purana's name for Prahlada's mother; the Bhagavata calls her Kayadhu." }

- id: anuhlada
  name: Anuhlada
  aka: [Anuhrada]
  sex: m
  kind: asura
  title: son of Hiranyakashipu
  summary: Youngest-but-two of Hiranyakashipu's sons. Adi 67 says he was born on earth as Dhrishtaketu.
  parents:
    - { id: hiranyakashipu, rel: father, cite: adi 65 }

- id: virochana
  name: Virochana
  sex: m
  kind: asura
  title: son of Prahlada
  summary: Son of Prahlada and father of Bali.
  wiki: Virochana
  parents:
    - { id: prahlada, rel: father, cite: adi 65 }

- id: bali
  name: Mahabali
  aka: [Bali, Bali Vairochana, Vairochani]
  sex: m
  kind: asura
  title: asura king, Prahlada's grandson, who gave Vamana three steps
  summary: Son of Virochana and grandson of Prahlada; father of Bana. He conquered the three worlds. When Vishnu came as the dwarf Vamana and begged three steps of land, Bali gave them despite his guru Shukra's warning. He was sent to rule Sutala, promised Indra's throne in the age of Savarni Manu, and is visited there by Indra in the epic's Shanti Parva. Not the vanara Vali, nor the Anava king Bali.
  wiki: Mahabali
  parents:
    - { id: virochana, rel: father, cite: adi 65 }
  spouses:
    - { id: ashana, ver: purana, cite: "Bhagavata Purana 6.18.17" }

- id: bana
  name: Bana
  aka: [Banasura, Vana, Mahakala]
  sex: m
  kind: asura
  title: thousand-armed asura, devotee of Shiva
  summary: Son of Bali, a follower of Rudra also called Mahakala. His daughter Usha fell in love with Krishna's grandson Aniruddha.
  wiki: Banasura
  parents:
    - { id: bali, rel: father, cite: adi 65 }
    - { id: ashana, rel: mother, ver: purana, cite: "Bhagavata Purana 6.18.17", note: "Bali's hundred sons, Bana the eldest, were born of Ashana." }
    - { id: kotara, rel: mother, ver: purana, cite: "Bhagavata Purana 10.63.20", note: "tan-mātā koṭarā nāma: the Bhagavata names Bana's mother Kotara here, against Ashana at 6.18.17." }

- id: usha
  name: Usha
  aka: [Ushas, Usa]
  sex: f
  kind: asura
  title: Bana's daughter, wife of Aniruddha
  summary: Daughter of Bana. She saw Aniruddha in a dream and had him carried to her palace; Krishna fought Bana to free him, and she married him.
  parents:
    - { id: bana, rel: father, cite: "PE: USA I" }
  spouses:
    - { id: aniruddha, cite: "PE: USA I" }

- id: hiranyaksha
  name: Hiranyaksha
  sex: m
  kind: asura
  title: Daitya, brother of Hiranyakashipu
  summary: Daitya paired with Hiranyakashipu as the first birth of Vishnu's cursed gatekeepers Jaya and Vijaya; killed by Vishnu (as the boar, in the Puranas).
  notes: "The Mahabharata gives Diti one son, Hiranyakashipu (Adi 65); the Puranas add his brother Hiranyaksha. Bhagavata 3.17.18 has Hiranyaksha born first, Bhagavata 7.1.39 calls Hiranyakashipu the elder."
  wiki: Hiranyaksha
  ver: purana
  incarnation:
    - { of: jaya-vijaya, kind: rebirth, ver: purana, cite: "PE: JAYA XI; Bhagavata Purana 7.1.36-39" }
  parents:
    - { id: diti, rel: mother, ver: purana, cite: "Vishnu Purana 1.15.140; Bhagavata Purana 3.17.18, 6.18.11" }
    - { id: kashyapa, rel: father, ver: purana, cite: "Vishnu Purana 1.15.140; Bhagavata Purana 3.17.18" }
  spouses:
    - { id: upadanavi, ver: purana, cite: "Bhagavata Purana 6.6.33-34" }

# --- Danu's and Danayu's lines ---
- id: puloman
  name: Puloman
  aka: [Pauloman, Puloma]
  sex: m
  kind: asura
  title: Danava, father of Shachi
  summary: One of Danu's forty sons; father of Shachi, who is called Paulomi, "Puloman's daughter".
  parents: [{ id: danu, rel: mother, cite: adi 65 }, { id: kashyapa, rel: father, cite: "adi 65; CE 1.59.11, 1.59.22" }]

- id: vritra
  name: Vritra
  sex: m
  kind: asura
  title: the great asura slain by Indra
  summary: Son of Danayu, "Vritra the great Asura", Indra's archetypal enemy. Adi 67 says he was born on earth as King Manimat.
  wiki: Vritra
  parents:
    - { id: danayu, rel: mother, cite: adi 65 }
    - { id: kashyapa, rel: father, cite: adi 65 }
    - { id: tvashtri, rel: father, cite: "CE 5.9.40-43", note: "In the Udyoga, Tvashtri creates Vritra to avenge his son Trishiras; the Adi Parva makes Vritra a son of Kashyapa and Danayu." }

# --- Vinata's and Kadru's lines ---
- id: garuda
  name: Garuda
  aka: [Suparna, Vainateya, Tarkshya]
  sex: m
  kind: animal
  title: king of birds, Vishnu's mount
  summary: Son of Vinata and Kashyapa, king of birds. He stole the nectar from the gods to free his mother from Kadru, and became Vishnu's mount. Adi 66 reckons him among the Adityas.
  wiki: Garuda
  parents: [{ id: vinata, rel: mother, cite: "adi 65, 66" }, { id: kashyapa, rel: father, cite: adi 65 }]

- id: aruna
  name: Aruna
  sex: m
  kind: god
  title: charioteer of the Sun
  summary: Son of Vinata, Garuda's elder brother and the Sun's charioteer. By Shyeni he fathered the vultures Sampati and Jatayu.
  wiki: Aruna (Hinduism)
  parents: [{ id: vinata, rel: mother, cite: "adi 65, 66" }, { id: kashyapa, rel: father, cite: adi 65 }]
  spouses:
    - { id: shyeni, cite: adi 66 }

- id: shyeni
  name: Shyeni
  aka: [Syeni]
  sex: f
  kind: animal
  title: mother of Sampati and Jatayu
  summary: Daughter of Tamra and wife of Aruna; mother of the vultures Sampati and Jatayu.
  parents:
    - { id: tamra, rel: mother, cite: "CE 1.60.54-55; adi 66; Ramayana 3.13.17-19" }
    - { id: kashyapa, rel: father, cite: "Ramayana 3.13.11-17" }

- id: sampati
  name: Sampati
  sex: m
  kind: animal
  title: vulture, elder brother of Jatayu
  summary: Son of Aruna and Shyeni, the elder vulture who in the Rama story points the monkeys toward Lanka.
  wiki: Sampati
  parents: [{ id: aruna, rel: father, cite: adi 66 }, { id: shyeni, rel: mother, cite: adi 66 }]

- id: jatayu
  name: Jatayu
  sex: m
  kind: animal
  title: vulture who fought Ravana
  summary: Son of Aruna and Shyeni; in the Rama story he fought Ravana to save Sita and was cut down.
  wiki: Jatayu
