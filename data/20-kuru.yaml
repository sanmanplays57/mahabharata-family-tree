# The Kuru core: Shantanu to Janamejaya.

- id: shantanu
  name: Shantanu
  aka: [Santanu]
  sex: m
  kind: human
  house: kuru
  title: king of Hastinapura
  summary: Son of Pratipa, whose touch restored the old to youth. He married Ganga, then Satyavati; for his sake Bhishma swore lifelong celibacy.
  wiki: Shantanu
  parents:
    - { id: pratipa, rel: father, cite: adi 95 }
    - { id: sunanda-shibi, rel: mother, cite: adi 95 }
  spouses:
    - { id: ganga, cite: "adi 95, 98" }
    - { id: satyavati, cite: "adi 95, 100" }
  incarnation:
    - { of: mahabhisha, kind: rebirth, cite: "adi 96, 97", note: "Cursed by Brahma for staring at Ganga in heaven." }

- id: ganga
  name: Ganga
  aka: [Ganges, Jahnavi, Bhagirathi]
  sex: f
  kind: god
  title: river goddess
  summary: The river goddess. She married Shantanu on condition he never question her, and drowned seven newborn sons — the Vasus, freeing them from their curse. Shantanu stopped her at the eighth, Bhishma.
  wiki: Ganga in Hinduism

- id: ganga-sons
  name: Seven elder sons of Ganga
  kind: group
  title: drowned at birth
  summary: Seven sons of Shantanu and Ganga, each thrown into the river at birth. They were seven of the Vasus, released from Vasishtha's curse by dying at once.
  parents:
    - { id: shantanu, rel: father, cite: adi 98 }
    - { id: ganga, rel: mother, cite: adi 98 }
  incarnation:
    - { of: vasus, kind: portion, cite: adi 67 }

- id: bhishma
  name: Bhishma
  aka: [Devavrata, Gangeya, Shantanava, Pitamaha, Bhishma Pitamaha, Gangaputra]
  sex: m
  kind: human
  house: kuru
  title: grand-uncle of the Kurus
  summary: Eighth son of Shantanu and Ganga. He vowed never to marry or rule so that his father could marry Satyavati, and was granted death only when he chose it. Commander of the Kaurava army for ten days.
  wiki: Bhishma
  parents:
    - { id: shantanu, rel: father, cite: "adi 95, 98" }
    - { id: ganga, rel: mother, cite: "adi 95, 98" }
  incarnation:
    - { of: vasus, kind: portion, cite: "adi 63, 67", note: "The youngest of the eight Vasus." }
  returned:
    - { to: vasus, cite: "svargarohana 4, 5", note: "“Bhishma attained the Vasus — eight Vasus are now seen” (CE 18.5.9)." }

- id: uparichara
  name: Uparichara Vasu
  aka: [Uparichara, Vasu, Chaidya Uparichara]
  sex: m
  kind: human
  house: other
  title: king of Chedi
  summary: King of Chedi who received a crystal chariot from Indra. While hunting he sent his seed to his wife Girika by a hawk; it fell into the Yamuna and was swallowed by the fish Adrika, who bore Satyavati and Matsya.
  wiki: Uparichara Vasu
  spouses:
    - { id: girika, cite: adi 63 }

- id: girika
  name: Girika
  sex: f
  kind: human
  house: other
  title: wife of Uparichara
  summary: Wife of Uparichara Vasu, daughter of the mountain Kolahala and the river Shuktimati. The seed meant for her became Satyavati and Matsya.

- id: adrika
  name: Adrika
  sex: f
  kind: apsara
  title: apsara cursed to be a fish
  summary: Apsara cursed by a Brahmin to live as a fish in the Yamuna. She swallowed Uparichara's seed, and when fishermen caught her she gave birth to twins and was freed.

- id: dasharaja
  name: Dasharaja
  aka: [chief of the fishermen, Dasa]
  sex: m
  kind: human
  house: other
  title: chief of the fishermen
  summary: Chief of the fishermen who raised Satyavati. He would give her to Shantanu only if her sons inherited, which led to Bhishma's vow.

- id: satyavati
  name: Satyavati
  aka: [Gandhakali, Kali, Matsyagandha, Yojanagandha, Gandhavati, Daseyi]
  sex: f
  kind: human
  house: kuru
  title: queen of Hastinapura
  summary: Born from a fish and raised by fishermen. She bore Vyasa to the sage Parashara before marrying Shantanu, then summoned Vyasa to father heirs when her son Vichitravirya died childless.
  wiki: Satyavati
  birth: Taken from the belly of the fish Adrika along with her twin brother Matsya; smelled of fish until Parashara's blessing.
  parents:
    - { id: uparichara, rel: father, cite: adi 63 }
    - { id: adrika, rel: mother, cite: adi 63 }
    - { id: dasharaja, rel: adoptive-father, cite: adi 63, note: "The king gave her to the fishermen: “Let this one be thy daughter.”" }

- id: matsya
  name: Matsya
  sex: m
  kind: human
  house: other
  title: Satyavati's twin brother
  summary: Twin brother of Satyavati, born from the same fish. Uparichara kept him, and he became the virtuous King Matsya.
  parents:
    - { id: uparichara, rel: father, cite: adi 63 }
    - { id: adrika, rel: mother, cite: adi 63 }

- id: vasishtha
  name: Vasishtha
  aka: [Vasistha]
  sex: m
  kind: rishi
  title: great sage
  summary: Great sage. His curse on the eight Vasus, who stole his cow, sent them to be born as Ganga's sons. Great-grandfather of Vyasa.
  wiki: Vasishtha

- id: shakti
  name: Shakti
  aka: [Sakti, Shaktri]
  sex: m
  kind: rishi
  title: son of Vasishtha
  summary: Son of Vasishtha and father of Parashara; devoured by a rakshasa set on him by King Kalmashapada.
  wiki: Shakti Maharishi
  parents:
    - { id: vasishtha, rel: father, cite: adi 178 }

- id: parashara
  name: Parashara
  aka: [Parasara]
  sex: m
  kind: rishi
  title: sage, father of Vyasa
  summary: Sage, son of Shakti. He met Satyavati as she ferried him across the Yamuna, hid them in a fog of his making, and fathered Vyasa on an island in the river.
  wiki: Parashara
  parents:
    - { id: shakti, rel: father, cite: adi 60 }

- id: vyasa
  name: Vyasa
  aka: [Krishna Dvaipayana, Dwaipayana, Veda Vyasa, Badarayana, Vedavyasa]
  sex: m
  kind: rishi
  title: author of the epic, grandfather of the Kurus
  summary: Son of Parashara and Satyavati, born on an island in the Yamuna; arranger of the Vedas and composer of the Mahabharata. At his mother's request he fathered Dhritarashtra, Pandu and Vidura for his dead half-brother Vichitravirya.
  wiki: Vyasa
  birth: Born on an island in the Yamuna, hence "Dvaipayana".
  parents:
    - { id: parashara, rel: father, cite: "adi 60, 63" }
    - { id: satyavati, rel: mother, cite: "adi 60, 63" }

- id: shuka
  name: Shuka
  aka: [Suka, Shukadeva]
  sex: m
  kind: rishi
  title: son of Vyasa
  summary: Son of Vyasa and one of the disciples to whom he taught the Mahabharata; in the Shanti Parva he is born from Vyasa's seed on a fire-stick at the sight of the apsara Ghritachi.
  wiki: Shuka
  parents:
    - { id: vyasa, rel: father, cite: adi 63 }

- id: chitrangada-kuru
  name: Chitrangada
  sex: m
  kind: human
  house: kuru
  title: elder son of Shantanu and Satyavati
  summary: Elder son of Shantanu and Satyavati. He became king but was killed young by a Gandharva of the same name.
  wiki: Chitrangada (king)
  parents:
    - { id: shantanu, rel: father, cite: adi 95 }
    - { id: satyavati, rel: mother, cite: adi 95 }

- id: vichitravirya
  name: Vichitravirya
  sex: m
  kind: human
  house: kuru
  title: king, legal father of Dhritarashtra and Pandu
  summary: Younger son of Shantanu and Satyavati. Bhishma won him the princesses of Kashi, but he died childless; Vyasa then fathered sons on his widows, who count legally as Vichitravirya's.
  wiki: Vichitravirya
  parents:
    - { id: shantanu, rel: father, cite: adi 95 }
    - { id: satyavati, rel: mother, cite: adi 95 }
  spouses:
    - { id: ambika, cite: adi 95 }
    - { id: ambalika, cite: adi 95 }

- id: kashi-king
  name: King of Kashi
  aka: [Kashiraja, Kasiraja]
  sex: m
  kind: human
  house: other
  title: father of Amba, Ambika and Ambalika
  summary: King of Kashi whose three daughters Bhishma carried off from their svayamvara for Vichitravirya. Never named — the Adi Parva, the Critical Edition's Udyoga Parva and the Puranic Encyclopaedia all call him only "the king (lord) of Kashi".
  spouses:
    - { id: kashi-queen, cite: CE 5.174 }

- id: kashi-queen
  name: Queen of Kashi
  sex: f
  kind: human
  house: other
  title: Amba's mother (unnamed)
  summary: Wife of the king of Kashi and daughter of the royal sage Hotravahana; mother of Amba. Neither she nor her husband is named.
  parents:
    - { id: hotravahana, rel: father, cite: "CE 5.174", note: "Amba bows to “Hotravahana, her mother's father”." }

- id: hotravahana
  name: Hotravahana
  sex: m
  kind: human
  house: other
  title: royal sage, Amba's maternal grandfather
  summary: Royal sage (rajarshi) and Amba's maternal grandfather. He found her in a hermitage after Shalva rejected her and sent her to Parashurama, who then fought Bhishma for twenty-three days on her behalf.
  pe: HOTRAVAHANA

- id: amba
  name: Amba
  aka: [Amva]
  sex: f
  kind: human
  house: other
  title: eldest princess of Kashi
  summary: Eldest princess of Kashi, carried off by Bhishma. Her chosen husband Shalva rejected her after the abduction, and Bhishma would not marry her; she vowed to destroy him and was reborn as Shikhandi.
  wiki: Amba (Mahabharata)
  parents:
    - { id: kashi-king, rel: father, cite: adi 102 }
    - { id: kashi-queen, rel: mother, cite: "CE 5.174" }

- id: ambika
  name: Ambika
  aka: [Amvika]
  sex: f
  kind: human
  house: kuru
  title: mother of Dhritarashtra
  summary: Princess of Kashi and widow of Vichitravirya. She shut her eyes at Vyasa's fearsome appearance during niyoga, so her son Dhritarashtra was born blind; next time she sent her maid in her place.
  wiki: Ambika (Mahabharata)
  parents:
    - { id: kashi-king, rel: father, cite: "adi 95, 102" }
    - { id: kashi-queen, rel: mother, note: "Inferred: the three are called sisters, but only Amba's maternal line is named." }

- id: ambalika
  name: Ambalika
  aka: [Amvalika]
  sex: f
  kind: human
  house: kuru
  title: mother of Pandu
  summary: Princess of Kashi and widow of Vichitravirya. She turned pale at the sight of Vyasa, so her son Pandu was born pale.
  wiki: Ambalika
  parents:
    - { id: kashi-king, rel: father, cite: "adi 95, 102" }
    - { id: kashi-queen, rel: mother, note: "Inferred: the three are called sisters, but only Amba's maternal line is named." }

- id: ambika-maid
  name: Ambika's maid
  aka: [Sudra maid, Parishrami]
  sex: f
  kind: human
  house: other
  title: mother of Vidura
  summary: The Sudra maidservant Ambika sent to Vyasa in her place. She received him gladly, and her son Vidura was born wise and sound.

- id: dhritarashtra
  name: Dhritarashtra
  aka: [Dhritarastra]
  sex: m
  kind: human
  house: kuru
  title: blind king, father of the Kauravas
  summary: Eldest son of Ambika, fathered by Vyasa in the name of the dead Vichitravirya, and born blind. As king he never restrained his son Duryodhana.
  wiki: Dhritarashtra
  parents:
    - { id: ambika, rel: mother, cite: adi 95 }
    - { id: vichitravirya, rel: legal-father, cite: "adi 63, 95" }
    - { id: vyasa, rel: father, cite: "adi 63, 67, 95" }
  spouses:
    - { id: gandhari, cite: adi 110 }
  incarnation:
    - { of: hamsa, kind: avatar, cite: "adi 67", note: "CE 1.61.77-78: Arishta’s son Hamsa, lord of the Gandharvas, was born as Dhritarashtra from Vyasa. Ganguli’s translation splits this sentence in two." }
  returned:
    - { to: hamsa, cite: "svargarohana 4", note: "Indra shows him in heaven as “the king of the Gandharvas”; Svargarohana 5 adds that he reached the realms of Kubera." }

- id: pandu
  name: Pandu
  sex: m
  kind: human
  house: kuru
  title: king, legal father of the Pandavas
  summary: Son of Ambalika by Vyasa, legally Vichitravirya's. He ruled in place of his blind brother until a dying sage's curse made union with a wife fatal to him, so his sons were fathered by gods.
  wiki: Pandu
  parents:
    - { id: ambalika, rel: mother, cite: adi 95 }
    - { id: vichitravirya, rel: legal-father, cite: "adi 63, 95" }
    - { id: vyasa, rel: father, cite: "adi 63, 95" }
  spouses:
    - { id: kunti, cite: adi 95 }
    - { id: madri, cite: adi 95 }

- id: vidura
  name: Vidura
  aka: [Kshatta, Kshattri]
  sex: m
  kind: human
  house: kuru
  title: counsellor, Dharma incarnate
  summary: Son of Vyasa by Ambika's Sudra maid, and so barred from the throne. The wisest counsellor at the Kuru court; he was the god Dharma, cursed by the sage Animandavya to be born a Sudra.
  wiki: Vidura
  parents:
    - { id: vyasa, rel: father, cite: "adi 63, 95, 106" }
    - { id: ambika-maid, rel: mother, cite: adi 106 }
  spouses:
    - { id: devaka-daughter, cite: adi 114 }
  incarnation:
    - { of: dharma, kind: avatar, cite: "adi 63, 106", note: "Cursed by Animandavya for punishing him too harshly. Adi 67 adds, oddly, that he was “the excellent son of the Rishi Atri”." }
  returned:
    - { to: yudhishthira, note: "At his death Vidura's spirit enters Yudhishthira's body through yoga (Ashramavasika Parva).", cite: ashramavasika 26 }
    - { to: dharma, cite: "svargarohana 5", note: "“Kshattri (Vidura) and King Yudhishthira entered Dharma” (CE 18.5.19)." }

- id: devaka-daughter
  name: Daughter of Devaka
  aka: [Parashavi]
  sex: f
  kind: human
  house: other
  title: wife of Vidura
  summary: Daughter of King Devaka by a Sudra wife, chosen by Bhishma as Vidura's bride. Later texts call her Parashavi.
  parents:
    - { id: devaka, rel: father, cite: adi 114 }

- id: gandhari
  name: Gandhari
  sex: f
  kind: human
  house: other
  title: queen, mother of the Kauravas
  summary: Princess of Gandhara who blindfolded herself for life on marrying the blind Dhritarashtra. After two years' pregnancy she bore a mass of flesh, which Vyasa divided into a hundred sons and a daughter.
  wiki: Gandhari (Mahabharata)
  parents:
    - { id: subala, rel: father, cite: "adi 63, 67, 110" }
  incarnation:
    - { of: mati, kind: avatar, cite: adi 67 }

- id: subala
  name: Subala
  aka: [Suvala]
  sex: m
  kind: human
  house: other
  title: king of Gandhara
  summary: King of Gandhara, father of Gandhari and Shakuni.

- id: shakuni
  name: Shakuni
  aka: [Sakuni, Saubala, Gandhararaja]
  sex: m
  kind: human
  house: other
  title: Duryodhana's uncle, the dice master
  summary: Gandhari's brother. He won the Pandavas' kingdom from Yudhishthira in the rigged dice game and was killed by Sahadeva in the war.
  wiki: Shakuni
  parents:
    - { id: subala, rel: father, cite: adi 63 }
  incarnation:
    - { of: dvapara, kind: avatar, cite: adi 67, note: "“Was Dwapara himself.”" }
  returned:
    - { to: dvapara, cite: "svargarohana 5" }

- id: kunti
  name: Kunti
  aka: [Pritha, Kuntibhojaja]
  sex: f
  kind: human
  house: yadava
  title: mother of Karna and the Pandavas
  summary: Born Pritha, daughter of the Yadava Shura, and given as a baby to her father's childless cousin Kuntibhoja. A boon from Durvasa let her summon any god for a son. She bore Karna to Surya before marriage, then Yudhishthira, Bhima and Arjuna as Pandu's wife.
  wiki: Kunti
  parents:
    - { id: shura, rel: father, cite: adi 67 }
    - { id: kuntibhoja, rel: adoptive-father, cite: adi 67, note: "Shura had promised his firstborn to his childless cousin." }
    - { id: marisha, rel: mother, cite: "PE: SURA VI" }
  incarnation:
    - { of: siddhi, kind: avatar, cite: adi 67 }

- id: kuntibhoja
  name: Kuntibhoja
  sex: m
  kind: human
  house: yadava
  title: adoptive father of Kunti
  summary: Yadava king of the Kuntis. Childless, he adopted Shura's firstborn Pritha, who is named Kunti after him; later he had two sons, Purujit and a younger Kuntibhoja, who fought for the Pandavas. His wife is not named in the epic or in the Puranic Encyclopaedia. Adi 67 calls him the son of Shura's paternal aunt; the Puranic Encyclopaedia, the son of Shura's sister.
  parents:
    - { id: kuntibhoja-mother, rel: mother, cite: "PE: KUNTIBHOJA", note: "Adi 67 instead: “the son of his (Shura’s) paternal aunt”." }

- id: madra-king
  name: King of Madra
  aka: [Artayana]
  sex: m
  kind: human
  house: other
  title: father of Shalya and Madri
  summary: Father of Shalya and Madri; unnamed in the Adi Parva.

- id: madri
  name: Madri
  sex: f
  kind: human
  house: other
  title: mother of Nakula and Sahadeva
  summary: Princess of Madra and Pandu's second wife; Bhishma paid a heavy bride-price for her. She used Kunti's mantra to bear twins to the Ashvins, and joined Pandu on his funeral pyre after his death in her embrace.
  wiki: Madri
  parents:
    - { id: madra-king, rel: father, cite: "PE: MADRI" }
  incarnation:
    - { of: dhriti, kind: avatar, cite: adi 67 }

- id: shalya
  name: Shalya
  aka: [Salya, Madraraja]
  sex: m
  kind: human
  house: other
  title: king of Madra, uncle of the twins
  summary: Madri's brother. Duryodhana tricked him into fighting for the Kauravas; as Karna's charioteer he undermined him. He commanded the Kaurava army on the last day and was killed by Yudhishthira.
  wiki: Shalya
  parents:
    - { id: madra-king, rel: father, cite: "PE: MADRI" }
  incarnation:
    - { of: samhlada, kind: rebirth, cite: adi 67 }

- id: karna
  name: Karna
  aka: [Vasusena, Radheya, Vaikartana, Suryaputra, Angaraja, Sutaputra, Kaunteya, Partha]
  sex: m
  kind: human
  house: kuru
  title: Kunti's firstborn, king of Anga
  summary: Kunti's son by Surya, born before her marriage with natural armour and earrings. She set him adrift in a river, and the charioteer Adhiratha and his wife Radha raised him. Duryodhana's closest friend; he learned only on the eve of war that the Pandavas were his brothers.
  wiki: Karna
  birth: Born to the unmarried Kunti with natural armour and earrings; cast into the water in a basket.
  parents:
    - { id: kunti, rel: mother, cite: "adi 63, 67, 111" }
    - { id: surya, rel: divine-father, cite: "adi 63, 67, 111" }
    - { id: adhiratha, rel: adoptive-father, cite: "adi 67, 111" }
    - { id: radha, rel: adoptive-mother, cite: "adi 67, 111" }
  incarnation:
    - { of: surya, kind: portion, cite: adi 67, note: "“The best portion of the maker of day.”" }
  returned:
    - { to: surya, cite: "svargarohana 4, 5", note: "“Karna entered the Sun, his father” (āviveśa raviṃ karṇaḥ pitaram, CE 18.5.18)." }

- id: adhiratha
  name: Adhiratha
  sex: m
  kind: human
  house: other
  title: charioteer, Karna's foster father
  summary: Charioteer (suta) who found the infant Karna floating in a basket and raised him with his wife Radha.
  spouses:
    - { id: radha, cite: adi 111 }

- id: radha
  name: Radha
  sex: f
  kind: human
  house: other
  title: Karna's foster mother
  summary: Wife of the charioteer Adhiratha and Karna's foster mother; Karna is called Radheya after her.

- id: yudhishthira
  name: Yudhishthira
  aka: [Dharmaraja, Ajatashatru, Yudhisthira, Yudhishthir, Yudhistir, Dharmaputra, Kaunteya, Partha, Kanka]
  sex: m
  kind: human
  house: kuru
  title: eldest Pandava, emperor
  summary: Eldest Pandava, son of Kunti by Dharma, famed for truthfulness. He gambled away his kingdom, brothers and wife to Shakuni, then reigned after the war.
  wiki: Yudhishthira
  parents:
    - { id: kunti, rel: mother, cite: "adi 95, 124" }
    - { id: pandu, rel: legal-father, cite: "adi 95, 124" }
    - { id: dharma, rel: divine-father, cite: "adi 63, 95" }
  spouses:
    - { id: draupadi, cite: adi 95 }
    - { id: devika, cite: adi 95 }
  incarnation:
    - { of: dharma, kind: portion, cite: adi 67 }
    - { of: five-indras, kind: rebirth, cite: adi 199, note: "One of the five former Indras (Vyasa's story to Drupada)." }
  returned:
    - { to: dharma, cite: "svargarohana 5", note: "“Kshattri (Vidura) and King Yudhishthira entered Dharma” (CE 18.5.19)." }

- id: bhima
  name: Bhima
  aka: [Bhimasena, Vrikodara, Bhim, Kaunteya, Partha, Ballava, Bhimsen]
  sex: m
  kind: human
  house: kuru
  title: second Pandava
  summary: Second Pandava, son of Kunti by Vayu, of enormous strength and appetite. He killed Hidimba, Jarasandha and Kichaka, and in the war killed all hundred Kaurava brothers, Duhshasana and Duryodhana among them.
  wiki: Bhima
  parents:
    - { id: kunti, rel: mother, cite: "adi 95, 124" }
    - { id: pandu, rel: legal-father, cite: "adi 95, 124" }
    - { id: vayu, rel: divine-father, cite: "adi 63, 95" }
  spouses:
    - { id: draupadi, cite: adi 95 }
    - { id: hidimbi, cite: "adi 61, 95" }
    - { id: valandhara, cite: adi 95 }
  incarnation:
    - { of: vayu, kind: portion, cite: adi 67 }
    - { of: five-indras, kind: rebirth, cite: adi 199 }
  returned:
    - { to: vayu, cite: "svargarohana 4", note: "Seen in heaven seated beside the Wind god, among the Maruts." }

- id: arjuna
  name: Arjuna
  aka: [Partha, Dhananjaya, Savyasachi, Gudakesha, Phalguna, Kiriti, Jishnu, Bibhatsu, Vijaya, Shvetavahana, Krishna, Kaunteya, Brihannala, Gandivadhanva, Arjun]
  sex: m
  kind: human
  house: kuru
  title: third Pandava, the archer
  summary: Third Pandava, son of Kunti by Indra, and the greatest archer of his age. He won Draupadi at her svayamvara, received the Bhagavad Gita from Krishna, and killed Karna.
  wiki: Arjuna
  parents:
    - { id: kunti, rel: mother, cite: "adi 95, 124" }
    - { id: pandu, rel: legal-father, cite: "adi 95, 124" }
    - { id: indra, rel: divine-father, cite: "adi 63, 95" }
  spouses:
    - { id: draupadi, cite: adi 95 }
    - { id: subhadra, cite: "adi 63, 95" }
    - { id: ulupi, cite: adi 216 }
    - { id: chitrangada-manipur, cite: adi 217 }
  incarnation:
    - { of: nara, kind: avatar, cite: adi 67 }
    - { of: indra, kind: portion, cite: adi 67, note: "Adi 67 says both: a portion of Indra, and Nara reborn." }
    - { of: five-indras, kind: rebirth, cite: adi 199 }

- id: nakula
  name: Nakula
