# --- Astika ---
- id: jaratkaru-rishi
  name: Jaratkaru
  aka: [Jaratkaru the sage]
  sex: m
  kind: rishi
  title: ascetic who would marry only a namesake
  summary: Ascetic who vowed to marry only a woman with his own name; Vasuki gave him his sister, also called Jaratkaru. He left her when she woke him late for his evening rites, telling her the child she carried would save the snakes.
  wiki: Jaratkaru

- id: jaratkaru-naga
  name: Jaratkaru
  aka: [Manasa, Jaratkaru (Vasuki's sister)]
  sex: f
  kind: naga
  title: Vasuki's sister, mother of Astika
  summary: Younger sister of the naga king Vasuki, married to the sage of the same name so that her son could save the nagas from Kadru's curse.
  parents:
    - { id: kadru, rel: mother, cite: adi 14, note: "Called Vasuki’s younger sister (Adi 14); his parents are Kadru and Kashyapa." }
    - { id: kashyapa, rel: father, cite: adi 14 }
  spouses:
    - { id: jaratkaru-rishi, cite: "adi 14, 15" }

- id: astika
  name: Astika
  sex: m
  kind: rishi
  title: half-naga sage who stopped the snake sacrifice
  summary: Son of the sage Jaratkaru and the naga Jaratkaru. He persuaded Janamejaya to end the snake sacrifice before Takshaka fell into the fire — the occasion at which the whole Mahabharata is recited.
  wiki: Astika (sage)
  parents:
    - { id: jaratkaru-rishi, rel: father, cite: adi 15 }
    - { id: jaratkaru-naga, rel: mother, cite: adi 15 }

# --- Krishna's and Balarama's households (Vishnu Purana 4.15) ---
- id: devaki-sons
  name: Devaki's six sons
  kind: group
  title: killed by Kamsa
  aka: [Shadgarbhas, Shadgarbha, the six embryos]
  summary: The six sons Vasudeva had by Devaki before Balarama and Krishna, all killed at birth by Kamsa. The Bhagavata's list (9.24.54) reads Kirtiman, Sushena, Bhadrasena, Riju, Sammardana and Bhadra. Their previous lives differ by text. In the Harivamsa they were Kalanemi's Danava sons, so Kamsa, Kalanemi reborn, killed his own former sons. In the Bhagavata they were Marichi's sons, cursed through a life as Hiranyakashipu's. There Krishna later fetches them from Sutala, Bali's realm; Devaki nurses them with the milk left over from Krishna, and touched by him they go free to the gods (10.85.34–56).
