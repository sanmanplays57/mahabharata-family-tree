    - { of: marichi-sons, kind: rebirth, ver: purana, cite: "Bhagavata Purana 10.85.47-51", disputed: true, note: "After a life as Hiranyakashipu's sons; Krishna later brings them back from the netherworld to comfort Devaki." }

