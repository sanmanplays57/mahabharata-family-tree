# Side stories and household details: Madhavi (Udyoga 115-122), Astika (Adi 13-15),
# Krishna's and Balarama's households (Vishnu Purana 4.15), the Pandava wives' fathers (Adi 95).

# --- Madhavi ---
- id: madhavi
  name: Madhavi
  sex: f
  kind: human
  house: kuru
  title: Yayati's daughter, mother of four kings
  summary: Daughter of Yayati, given to the sage Galava, who needed 800 rare horses as his teacher's fee. He lent her in turn to Haryashva of Ayodhya, Divodasa of Kashi and Ushinara, each paying horses for one son, and finally to Vishvamitra; after each birth she became a maiden again. Offered a svayamvara at last, she chose the forest. Her four sons later gave their merit to Yayati when he fell from heaven.
  birth: Regained her maidenhood after each of her four sons (Udyoga 118).
  wiki: Madhavi (Mahabharata)
  parents:
    - { id: yayati, rel: father, cite: "udyoga 115, 120" }
  spouses:
    - { id: haryashva-2, cite: udyoga 116, far: true, note: "Haryashva of Ikshvaku's race, king of Ayodhya — in the Vishnu Purana's solar list, many generations below Yayati." }
    - { id: divodasa-kashi, cite: udyoga 117 }
    - { id: ushinara, cite: udyoga 118, far: true }
    - { id: vishvamitra, cite: udyoga 119, far: true }

