# The lunar line from Manu and Ila down to Pratipa, following the detailed
# genealogy of Adi 95 (Ganguli spellings kept as aliases). Wives' fathers are in notes.

- id: manu
  name: Vaivasvata Manu
  aka: [Manu, Vaivasvata, Shraddhadeva]
  sex: m
  kind: human
  house: other
  title: progenitor of mankind
  summary: Son of Vivasvat (the Sun) and father of humankind. Through his child Ila he is the ancestor of the lunar line.
  wiki: Vaivasvata Manu
  parents:
    - { id: surya, rel: father, cite: "adi 75, 95" }
    - { id: tvashtri-daughter, rel: mother, ver: purana, cite: "Vishnu Purana 3.2.2; Brahma Purana 4.8" }
  spouses:
    - { id: shraddha-manu, ver: purana, cite: "Bhagavata Purana 9.1.11-12" }

- id: ila
  name: Ila
  aka: [Ha, Sudyumna]
  sex: f
  kind: human
  house: kuru
  title: child of Manu who changed sex
  summary: Child of Manu who alternated between female and male. Adi 75 says Ila was both mother and father of Pururavas; the Puranas name the Moon's son Budha as the father.
  wiki: Ila (Hinduism)
  parents:
    - { id: manu, rel: father, cite: adi 95 }
  spouses:
    - { id: budha, ver: purana, cite: "PE: BUDHA" }

- id: budha
  name: Budha
  aka: [Mercury]
  sex: m
  kind: god
  title: Mercury, son of the Moon
  summary: The planet Mercury, son of Soma by Tara, the wife of Brihaspati — itself a case of contested paternity. Not named in the Adi Parva's genealogies; the Puranas make him Pururavas's father.
  wiki: Budha
  ver: purana
  parents:
    - { id: soma, rel: father, ver: purana, cite: "PE: BUDHA; Vishnu Purana 4.6.21-22", note: "Soma embraced the newborn and named him Budha, “the wise one”." }
    - { id: tara, rel: mother, ver: purana, cite: "Vishnu Purana 4.6.19-21; PE: BUDHA", note: "Brihaspati's wife, carried off by Soma. Returned to Brihaspati pregnant, she was asked by the gods whose the child was, Soma's or Brihaspati's, and at last, ashamed, named Soma." }

- id: tara
  name: Tara
  sex: f
  kind: god
  title: wife of Brihaspati
  summary: Wife of Brihaspati, abducted by Soma, by whom she bore Budha. Both Soma and Brihaspati claimed the child.
  wiki: Tara (Hindu goddess)
  ver: purana
  spouses:
    - { id: brihaspati, ver: purana, cite: "PE: TARA II" }

- id: pururavas
  name: Pururavas
  sex: m
  kind: human
  house: kuru
  title: first king of the lunar line
  summary: Born of Ila, and lover of the apsara Urvashi, by whom he had six sons. Adi 75 says Ila "was both his mother and father".
  wiki: Pururavas
  parents:
    - { id: ila, rel: mother, cite: adi 75, note: "Adi 75: “Ila was both his mother and father.”" }
    - { id: budha, rel: father, ver: purana, cite: "PE: BUDHA" }
  spouses:
    - { id: urvashi, cite: adi 75 }

- id: urvashi
  name: Urvashi
  aka: [Urvasi]
  sex: f
  kind: apsara
  title: celestial nymph
  summary: Foremost of the apsaras. She lived with Pururavas and bore him six sons, Ayus first among them.
  wiki: Urvashi

- id: ayus
  name: Ayus
  aka: [Ayu]
  sex: m
  kind: human
  house: kuru
  title: son of Pururavas
  summary: Eldest of Pururavas's six sons by Urvashi. On Svarbhanu's daughter he fathered Nahusha and three other sons.
  parents:
    - { id: pururavas, rel: father, cite: adi 75 }
    - { id: urvashi, rel: mother, cite: adi 75 }
  spouses:
    - { id: svarbhanu-daughter, cite: adi 75 }

- id: svarbhanu-daughter
  name: Daughter of Svarbhanu
  aka: [Prabha, Svarbhanavi]
  sex: f
  kind: asura
  title: wife of Ayus
  summary: Asura princess, daughter of Svarbhanu (Rahu), and mother of Nahusha. The Puranic Encyclopaedia (from the Brahmanda) calls her Prabha; the Vishnu Purana says only Rahu's daughter.
  parents:
    - { id: svarbhanu, rel: father, cite: adi 75 }

- id: nahusha
  name: Nahusha
  sex: m
  kind: human
  house: kuru
  title: king who briefly ruled heaven
  summary: Son of Ayus who for a time took Indra's throne, until the sage Agastya's curse turned him into a serpent. Father of Yayati.
  wiki: Nahusha
  parents:
    - { id: ayus, rel: father, cite: adi 75 }
    - { id: svarbhanu-daughter, rel: mother, cite: adi 75 }
  spouses:
    - { id: viraja-pitri, ver: harivamsa, cite: "Harivamsa 13.60; Vayu Purana 2.31.12" }

- id: yayati
  name: Yayati
  sex: m
  kind: human
  house: kuru
  title: father of the five lines
  summary: Son of Nahusha. Cursed with old age by Shukra, he took his youngest son Puru's youth in exchange and made Puru king over his elder brothers.
  wiki: Yayati
  parents:
    - { id: nahusha, rel: father, cite: adi 95 }
    - { id: viraja-pitri, rel: mother, ver: harivamsa, cite: "Harivamsa 13.60" }
  spouses:
    - { id: devayani, cite: adi 95 }
    - { id: sharmishtha, cite: adi 95 }

- id: shukra
  name: Shukra
  aka: [Sukra, Usanas, Ushanas, Kavya, Bhargava]
  sex: m
  kind: rishi
  title: preceptor of the asuras
  summary: Guru of the asuras, master of the art of reviving the dead. He cursed his son-in-law Yayati with old age.
  wiki: Shukra
  parents:
    - { id: bhrigu, rel: father, cite: adi 66 }
    - { id: kavi-bhargava, rel: father, cite: "CE 1.60.40", note: "“Bhrigu's son was the wise Kavi; Kavi's son is Shukra, the planet.”" }
    - { id: kavyamata, rel: mother, cite: "PE: KAVYAMATA", ver: purana, note: "The Puranas call Shukra's mother Kavyamata (PE, from the Devi Bhagavata)." }
  spouses:
    - { id: shataparva, cite: "CE 5.115.13" }

- id: devayani
  name: Devayani
  sex: f
  kind: human
  house: other
  title: daughter of Shukra
  summary: Shukra's daughter. Pushed into a well by the asura princess Sharmishtha, she married Yayati and made Sharmishtha her servant. Mother of Yadu and Turvasu.
  wiki: Devayani
  parents:
    - { id: shukra, rel: father, cite: "adi 78, 95" }
    - { id: urjasvati, rel: mother, ver: purana, cite: "Bhagavata Purana 5.1.33", note: "The epic does not name her mother. Popular retellings make it Jayanti, Indra's daughter; the Bhagavata says Priyavrata's daughter Urjasvati." }

- id: vrishaparvan
  name: Vrishaparvan
  sex: m
  kind: asura
  title: king of the asuras
  summary: Asura king, father of Sharmishtha. Adi 67 says he was born on earth as King Dirghaprajna.
  parents:
    - { id: danu, rel: mother, cite: adi 65 }
    - { id: kashyapa, rel: father, cite: "adi 65; CE 1.59.11, 1.59.24" }

- id: sharmishtha
  name: Sharmishtha
  aka: [Sarmishtha]
  sex: f
  kind: asura
  title: asura princess
  summary: Daughter of Vrishaparvan, made servant to Devayani after their quarrel. She secretly bore Yayati three sons, Puru the youngest.
  wiki: Sharmishtha
  parents:
    - { id: vrishaparvan, rel: father, cite: "adi 78, 95" }

- id: yadu
  name: Yadu
  sex: m
  kind: human
  house: yadava
  title: founder of the Yadavas
  summary: Eldest son of Yayati, by Devayani. He refused to give his father his youth and was disinherited; the Yadavas, Krishna's people, descend from him.
  parents:
    - { id: yayati, rel: father, cite: "adi 83, 95" }
    - { id: devayani, rel: mother, cite: "adi 83, 95" }

- id: turvasu
  name: Turvasu
  sex: m
  kind: human
  house: other
  title: son of Yayati
  summary: Second son of Yayati by Devayani; refused to take on his father's old age.
  parents:
    - { id: yayati, rel: father, cite: "adi 83, 95" }
    - { id: devayani, rel: mother, cite: "adi 83, 95" }

- id: druhyu
  name: Druhyu
  sex: m
  kind: human
  house: other
  title: son of Yayati
  summary: Son of Yayati by Sharmishtha; refused to take on his father's old age.
  parents:
    - { id: yayati, rel: father, cite: adi 95 }
    - { id: sharmishtha, rel: mother, cite: adi 95 }

- id: anu
  name: Anu
  sex: m
  kind: human
  house: other
  title: son of Yayati
  summary: Son of Yayati by Sharmishtha; refused to take on his father's old age.
  parents:
    - { id: yayati, rel: father, cite: adi 95 }
    - { id: sharmishtha, rel: mother, cite: adi 95 }

- id: puru
  name: Puru
  sex: m
  kind: human
  house: kuru
  title: founder of the Paurava line
  summary: Youngest son of Yayati. He gave his father his own youth for a thousand years and was made king; the Pauravas, Kurus and Pandavas descend from him.
  wiki: Puru (Vedic tribe)
  parents:
    - { id: yayati, rel: father, cite: adi 95 }
    - { id: sharmishtha, rel: mother, cite: adi 95 }
  spouses:
    - { id: kausalya-puru, cite: adi 95 }

- id: kausalya-puru
  name: Kausalya
  sex: f
  kind: human
  house: other
  title: wife of Puru
  summary: Wife of Puru and mother of Janamejaya I.

- id: janamejaya-1
  name: Janamejaya I
  aka: [Janamejaya]
  sex: m
  kind: human
  house: kuru
  title: son of Puru
  summary: Son of Puru who performed three horse-sacrifices and a Vishvajit sacrifice, then retired to the forest.
  parents:
    - { id: puru, rel: father, cite: adi 95 }
    - { id: kausalya-puru, rel: mother, cite: adi 95 }
  spouses:
    - { id: ananta, cite: adi 95, note: "daughter of Madhava" }

- id: ananta
  name: Ananta
  sex: f
  kind: human
  house: other
  title: daughter of Madhava
  summary: Wife of Janamejaya I and mother of Prachinvat.

- id: prachinvat
  name: Prachinvat
  aka: [Prachinwat]
  sex: m
  kind: human
  house: kuru
  title: conqueror of the east
  summary: Named for conquering the east as far as the sunrise. He married Ashmaki, a Yadava princess.
  parents:
    - { id: janamejaya-1, rel: father, cite: adi 95 }
    - { id: ananta, rel: mother, cite: adi 95 }
  spouses:
    - { id: ashmaki, cite: adi 95, note: "a daughter of the Yadavas" }

- id: ashmaki
  name: Ashmaki
  aka: [Asmaki]
  sex: f
  kind: human
  house: yadava
  title: Yadava princess
  summary: Yadava princess, wife of Prachinvat and mother of Samyati.

- id: samyati
  name: Samyati
  aka: [Sanyati]
  sex: m
  kind: human
  house: kuru
  summary: Son of Prachinvat and Ashmaki; husband of Varangi.
  parents:
    - { id: prachinvat, rel: father, cite: adi 95 }
    - { id: ashmaki, rel: mother, cite: adi 95 }
    - { id: bahugava, rel: father, ver: purana, cite: "Vishnu Purana 4.19.1", far: true }
  spouses:
    - { id: varangi, cite: adi 95, note: "daughter of Drishadvata" }

- id: varangi
  name: Varangi
  sex: f
  kind: human
  house: other
  summary: Daughter of Drishadvata; wife of Samyati and mother of Ahamyati.

- id: ahamyati
  name: Ahamyati
  aka: [Ahayanti, Ahampati]
  sex: m
  kind: human
  house: kuru
  summary: Son of Samyati and Varangi; husband of Bhanumati, daughter of Kritavirya.
  notes: "The Critical Edition reads Ahampati (CE 1.90.14–15)."
  parents:
    - { id: samyati, rel: father, cite: adi 95 }
    - { id: varangi, rel: mother, cite: adi 95 }
  spouses:
    - { id: bhanumati-kritavirya, cite: adi 95, note: "daughter of Kritavirya" }

- id: bhanumati-kritavirya
  name: Bhanumati
  sex: f
  kind: human
  house: other
  title: daughter of Kritavirya
  summary: Daughter of Kritavirya; wife of Ahamyati and mother of Sarvabhauma. Not the same as Duryodhana's wife of later tradition.

- id: sarvabhauma
  name: Sarvabhauma
  sex: m
  kind: human
  house: kuru
  summary: Son of Ahamyati. He took Sunanda, the Kekaya princess, by force.
  parents:
    - { id: ahamyati, rel: father, cite: adi 95 }
    - { id: bhanumati-kritavirya, rel: mother, cite: adi 95 }
  spouses:
    - { id: sunanda-kekaya, cite: adi 95, note: "the Kekaya princess, obtained by force" }

- id: sunanda-kekaya
  name: Sunanda
  sex: f
  kind: human
  house: other
  title: Kekaya princess
  summary: Kekaya princess taken by force by Sarvabhauma; mother of Jayatsena.

- id: jayatsena-paurava
  name: Jayatsena
  sex: m
  kind: human
  house: kuru
  summary: Son of Sarvabhauma and Sunanda; married Sushrava of Vidarbha.
  parents:
    - { id: sarvabhauma, rel: father, cite: adi 95 }
    - { id: sunanda-kekaya, rel: mother, cite: adi 95 }
  spouses:
    - { id: sushrava, cite: adi 95, note: "daughter of the Vidarbha king" }

- id: sushrava
  name: Sushrava
  aka: [Susrava]
  sex: f
  kind: human
  house: other
  title: Vidarbha princess
  summary: Daughter of the king of Vidarbha; mother of Avachina.

- id: avachina
  name: Avachina
  aka: [Aracina, Arachina]
  sex: m
  kind: human
  house: kuru
  summary: Son of Jayatsena; he too married a Vidarbha princess, Maryada.
  notes: "The Critical Edition spells him Aracina (CE 1.90.17–18)."
  parents:
    - { id: jayatsena-paurava, rel: father, cite: adi 95 }
    - { id: sushrava, rel: mother, cite: adi 95 }
  spouses:
    - { id: maryada-vidarbha, cite: adi 95 }

- id: maryada-vidarbha
  name: Maryada
  sex: f
  kind: human
  house: other
  title: Vidarbha princess
  summary: Vidarbha princess, wife of Avachina and mother of Arihan.

- id: arihan-1
  name: Arihan
  sex: m
  kind: human
  house: kuru
  title: son of Avachina (vulgate only)
  summary: Son of Avachina and Maryada; husband of Angi. The Critical Edition has no such generation.
  ver: vulgate
  parents:
    - { id: avachina, rel: father, ver: vulgate, cite: adi 95, note: "Only in the vulgate: CE 1.90.18 has Aracina (Avachina) and Maryada as Mahabhauma's own parents; Arihan and his wife Angi are a generation the Critical Edition puts in its notes (*0899)." }
    - { id: maryada-vidarbha, rel: mother, ver: vulgate, cite: adi 95, note: "Only in the vulgate: CE 1.90.18 has Aracina (Avachina) and Maryada as Mahabhauma's own parents; Arihan and his wife Angi are a generation the Critical Edition puts in its notes (*0899)." }
  spouses:
    - { id: angi, cite: adi 95 }

- id: angi
  name: Angi
  sex: f
  kind: human
  house: other
  summary: Wife of Arihan and mother of Mahabhauma, in the vulgate only.
  ver: vulgate

- id: mahabhauma
  name: Mahabhauma
  sex: m
  kind: human
  house: kuru
  summary: Son of Avachina and Maryada in the Critical Edition, of Arihan and Angi in the vulgate; married Suyajna, daughter of Prasenajit.
  parents:
    - { id: arihan-1, rel: father, ver: vulgate, cite: adi 95, note: "Only in the vulgate: CE 1.90.18 has Aracina (Avachina) and Maryada as Mahabhauma's own parents; Arihan and his wife Angi are a generation the Critical Edition puts in its notes (*0899)." }
    - { id: angi, rel: mother, ver: vulgate, cite: adi 95, note: "Only in the vulgate (CE 1.90.18 *0899)." }
    - { id: avachina, rel: father, cite: "CE 1.90.18" }
    - { id: maryada-vidarbha, rel: mother, cite: "CE 1.90.18" }
  spouses:
    - { id: suyajna, cite: adi 95, note: "daughter of Prasenajit" }

- id: suyajna
  name: Suyajna
  sex: f
  kind: human
  house: other
  summary: Daughter of Prasenajit; mother of Ayutanayi.

- id: ayutanayi
  name: Ayutanayi
  sex: m
  kind: human
  house: kuru
  summary: Named for a sacrifice that required the fat of ten thousand (ayuta) male beings. He married Kama, daughter of Prithushravas.
  parents:
    - { id: mahabhauma, rel: father, cite: adi 95 }
    - { id: suyajna, rel: mother, cite: adi 95 }
  spouses:
    - { id: kama-prithushravas, cite: adi 95, note: "daughter of Prithushravas" }

- id: kama-prithushravas
  name: Kama
  aka: [Bhasa]
  sex: f
  kind: human
  house: other
  title: daughter of Prithushravas
  summary: Daughter of Prithushravas; wife of Ayutanayi and mother of Akrodhana.
  notes: "The Critical Edition reads her name Bhasa (CE 1.90.20)."

- id: akrodhana
  name: Akrodhana
  sex: m
  kind: human
  house: kuru
  summary: Son of Ayutanayi; married Karambha, the Kalinga princess.
  parents:
    - { id: ayutanayi, rel: father, cite: adi 95 }
    - { id: kama-prithushravas, rel: mother, cite: adi 95 }
  spouses:
    - { id: karambha, cite: adi 95, note: "daughter of the king of Kalinga" }

- id: karambha
  name: Karambha
  aka: [Karandu]
  sex: f
  kind: human
  house: other
  title: Kalinga princess
  summary: Daughter of the king of Kalinga; mother of Devatithi.
  notes: "The Critical Edition reads her name Karandu (CE 1.90.21)."

- id: devatithi
  name: Devatithi
  sex: m
  kind: human
  house: kuru
  summary: Son of Akrodhana; married Maryada of Videha.
  parents:
    - { id: akrodhana, rel: father, cite: adi 95 }
    - { id: karambha, rel: mother, cite: adi 95 }
  spouses:
    - { id: maryada-videha, cite: adi 95 }

- id: maryada-videha
  name: Maryada
  sex: f
  kind: human
  house: other
  title: Videha princess
  summary: Princess of Videha; wife of Devatithi and mother of the second Arihan.

- id: arihan-2
  name: Arihan
  aka: [Richa, Rca]
  sex: m
  kind: human
  house: kuru
  title: son of Devatithi
  summary: Son of Devatithi; married Sudeva, princess of Anga.
  notes: "The Critical Edition calls him Rca, Devatithi's son by Maryada of Videha (CE 1.90.22–23)."
  parents:
    - { id: devatithi, rel: father, cite: adi 95 }
    - { id: maryada-videha, rel: mother, cite: adi 95 }
  spouses:
    - { id: sudeva-anga, cite: adi 95 }

- id: sudeva-anga
  name: Sudeva
  sex: f
  kind: human
  house: other
  title: princess of Anga
  summary: Princess of Anga; mother of Riksha.

- id: riksha
  name: Riksha
  sex: m
  kind: human
  house: kuru
  summary: Son of Arihan. He married the naga princess Jwala, daughter of Takshaka.
  parents:
    - { id: arihan-2, rel: father, cite: adi 95 }
    - { id: sudeva-anga, rel: mother, cite: adi 95 }
  spouses:
    - { id: jwala, cite: adi 95 }

- id: takshaka
  name: Takshaka
  sex: m
  kind: naga
  title: king of the nagas
  summary: Naga king. His daughter Jwala married into the Puru line; many generations later he killed King Parikshit, which led to Janamejaya's snake sacrifice, the frame story of the epic.
  wiki: Takshaka
  parents:
    - { id: kadru, rel: mother, cite: adi 65 }
    - { id: kashyapa, rel: father, cite: adi 65 }

- id: jwala
  name: Jwala
  aka: [Jvala]
  sex: f
  kind: naga
  title: daughter of Takshaka
  summary: Naga princess, daughter of Takshaka; wife of Riksha and mother of Matinara.
  parents:
    - { id: takshaka, rel: father, cite: adi 95 }

- id: matinara
  name: Matinara
  aka: [Rantinara]
  sex: m
  kind: human
  house: kuru
  summary: Son of Riksha and Jwala. After his twelve-year sacrifice on the Sarasvati, the river goddess appeared and chose him as her husband.
  parents:
    - { id: riksha, rel: father, cite: adi 95 }
    - { id: jwala, rel: mother, cite: adi 95 }
    - { id: anadhrishti, rel: father, cite: "adi 94; Vishnu Purana 4.19.1", far: true, note: "Adi 94 and, as Riteyu, the Vishnu Purana: Matinara is the son of Anadhrishti, one of Raudrashva's ten sons by the apsara Mishrakeshi, three generations below Puru; Adi 95 puts fifteen generations between." }
  spouses:
    - { id: saraswati, cite: adi 95 }

- id: saraswati
  name: Saraswati
  aka: [Sarasvati]
  sex: f
  kind: god
  title: river goddess
  summary: The river goddess. She appeared at the end of Matinara's sacrifice, chose him for her husband and bore Tamsu.
  wiki: Saraswati

- id: tamsu
  name: Tamsu
  aka: [Tansu]
  sex: m
  kind: human
  house: kuru
  summary: Son of Matinara and the river goddess Saraswati; father of Ilina.
  parents:
    - { id: matinara, rel: father, cite: adi 95 }
    - { id: saraswati, rel: mother, cite: adi 95 }
  spouses:
    - { id: kalingi, cite: adi 95 }

- id: kalingi
  name: Kalingi
  aka: [Kalindi]
  sex: f
  kind: human
  house: other
  title: Kalinga princess
  summary: Wife of Tamsu and mother of Ilina.
  notes: "The Critical Edition makes Tamsu's wife Kalindi, not a Kalinga princess (CE 1.90.28)."

- id: ilina
  name: Ilina
  aka: [Ilila]
  sex: m
  kind: human
  house: kuru
  summary: Son of Tamsu. By Rathantari he had five sons, the eldest of them Dushyanta.
  parents:
    - { id: tamsu, rel: father, cite: adi 95 }
    - { id: kalingi, rel: mother, cite: adi 95 }
  spouses:
    - { id: rathantari, cite: adi 95 }

- id: rathantari
  name: Rathantari
  sex: f
  kind: human
  house: other
  summary: Wife of Ilina and mother of five sons, Dushyanta the eldest.

- id: dushyanta
  name: Dushyanta
  aka: [Dushmanta, Dusyanta]
  sex: m
  kind: human
  house: kuru
  title: king, husband of Shakuntala
  summary: Eldest son of Ilina. He married Shakuntala in secret in Kanva's hermitage, then disowned her until a voice from heaven declared her son his own.
  wiki: Dushyanta
  parents:
